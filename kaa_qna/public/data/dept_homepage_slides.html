  <style>
    :root{--bg:#e9e6df;--paper:#fbfaf6;--card:#fff;--surface:#f1efe8;--ink:#17221e;--muted:#66706a;--line:#d8d6ce;--gold:#c7943a;--gold-soft:#efe0bd;--moss:#4d6a5c;--coral:#ba654d;--shadow:0 28px 72px rgb(23 34 30/.17)}
    html.dark{--bg:#0f1714;--paper:#17211d;--card:#1d2924;--surface:#25312c;--ink:#e7e9e3;--muted:#abb5af;--line:#34413b;--gold:#e0b45f;--gold-soft:#4a4029;--moss:#87a293;--coral:#d98a71;--shadow:0 28px 72px rgb(0 0 0/.42)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}button,input{font:inherit}
    body{background:radial-gradient(circle at 10% 8%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 27rem),radial-gradient(circle at 88% 86%,color-mix(in srgb,var(--moss) 12%,transparent),transparent 30rem),var(--bg)}
    .app{min-height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,2vh,24px);padding:clamp(18px,2.6vw,38px) clamp(20px,4.5vw,76px) 96px;overflow:hidden;position:relative}
    .top{width:min(1720px,100%);margin:auto;display:flex;align-items:end;justify-content:space-between;gap:20px}.top p{margin:0 0 4px;color:var(--gold);font-size:.75rem;font-weight:850;letter-spacing:.12em}.top span{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top strong{font:800 .9rem ui-monospace,monospace;white-space:nowrap}.top i{color:var(--line);font-style:normal}
    .stage{width:min(1720px,100%);max-height:calc(100svh - 120px);aspect-ratio:16/9;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:clamp(14px,2vw,26px);box-shadow:var(--shadow);overflow:hidden;position:relative}
    .content,.cover,.quote{height:100%;padding:clamp(24px,3.2vw,56px) clamp(30px,4.4vw,80px) clamp(48px,4.6vw,76px);position:relative}.content{display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,1.8vw,24px)}.content.ultra-fit{gap:8px}.eyebrow{margin:0 0 clamp(10px,1.4vw,20px);color:var(--gold);font-size:clamp(.65rem,1vw,.92rem);font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .heading h1{margin:0;max-width:1050px;font-size:clamp(2rem,3.2vw,3.7rem);font-weight:850;letter-spacing:-.045em;line-height:1.1;text-wrap:balance}.heading>p:last-child{margin:clamp(8px,1.3vw,18px) 0 0;max-width:980px;color:var(--muted);font-size:clamp(1.05rem,1.7vw,1.7rem);font-weight:600;line-height:1.5}
    .full{min-height:0;max-height:none;margin-top:0;overflow:hidden;border:1px solid var(--line);border-radius:clamp(12px,1.5vw,18px);background:color-mix(in srgb,var(--card) 94%,var(--gold-soft));scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
    .md{padding:clamp(14px,2.2vw,28px) clamp(16px,2.6vw,34px);font-size:clamp(1.05rem,1.95vw,1.95rem);font-weight:580;line-height:1.55}.md strong{font-weight:820}.md em{color:color-mix(in srgb,var(--ink) 80%,var(--gold))}.md code{padding:.12em .4em;border-radius:5px;background:var(--surface);color:var(--coral);font:700 .92em ui-monospace,monospace}
    .bullet{display:grid;grid-template-columns:24px minmax(0,1fr);gap:clamp(6px,.8vw,10px);padding:clamp(5px,.7vw,10px) 0}.bullet.l0{margin-top:clamp(7px,1vw,13px);padding-top:clamp(8px,1vw,13px);border-top:1px solid var(--line);font-size:1.04em;font-weight:700}.bullet.l0:first-child{margin-top:0;padding-top:0;border-top:0}.bullet.l1{padding-left:clamp(14px,2.3vw,32px);color:var(--muted)}.mark{color:var(--gold);font-size:.68em;padding-top:.18em}
    .table{overflow:visible;border:1px solid var(--line);border-radius:12px;background:var(--card)}table{width:100%;min-width:min(620px,100%);border-collapse:collapse;table-layout:auto}th,td{padding:clamp(10px,1.3vw,18px);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:var(--ink);color:var(--paper)}td{color:var(--muted)}td:first-child{color:var(--ink);font-weight:760}tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}
    .cover{display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 72% 35%,rgb(207 164 80/.32),transparent 18rem),linear-gradient(130deg,#152b22,#24352d 58%,#17251f);color:#f6f1e5}.cover h1{margin:0;max-width:950px;font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(2.3rem,5.7vw,6.1rem);font-weight:620;letter-spacing:-.06em;line-height:.98}.cover .sub{margin:clamp(18px,2.6vw,34px) 0 0;max-width:800px;color:#cfd8d2;font-size:clamp(1rem,1.7vw,1.48rem);line-height:1.55}.cover .md{align-self:flex-start;max-width:850px;margin-top:clamp(20px,3vw,42px);padding:.7em 1.1em;border:1px solid rgb(238 213 150/.45);border-radius:14px;color:#efd99e;font-size:clamp(.95rem,1.5vw,1.3rem)}
    .quote{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-left:clamp(42px,9vw,150px)}.qmark{height:.55em;color:var(--gold);font:clamp(5rem,10vw,10rem)/1 Georgia,serif;opacity:.45}.quote h1{margin:0;font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(2.1rem,5vw,5.2rem);font-weight:620;letter-spacing:-.055em;line-height:1.05}.quote .sub{margin:clamp(18px,2.4vw,32px) 0 0;max-width:920px;color:var(--muted);font-size:clamp(.95rem,1.5vw,1.3rem);line-height:1.6}.quote .md{max-width:980px;padding:14px 0 0;color:var(--moss);font-size:clamp(1rem,1.6vw,1.4rem)}
    .foot{position:absolute;left:clamp(30px,5.2vw,84px);right:clamp(30px,5.2vw,84px);bottom:clamp(17px,2.2vw,30px);display:flex;justify-content:space-between;color:var(--muted);font-size:clamp(.58rem,.8vw,.74rem);font-weight:700}.cover .foot{color:#84928b}
    .dock{position:fixed;z-index:20;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:6px;border:1px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 14px 42px rgb(18 28 24/.18);backdrop-filter:blur(18px)}.dock button{height:38px;padding:0 13px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.dock button:hover{background:var(--surface)}.dock button:disabled{opacity:.35;cursor:not-allowed}.divider{width:1px;height:24px;background:var(--line);margin:0 4px}
    dialog{width:min(1160px,calc(100% - 30px));height:min(78svh,740px);padding:0;border:1px solid var(--line);border-radius:22px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}dialog::backdrop{background:rgb(10 18 14/.55);backdrop-filter:blur(4px)}.dlghead{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 28px;border-bottom:1px solid var(--line)}.dlghead h2{margin:0;font-size:1.35rem}.search{display:flex;align-items:center;gap:8px;width:min(360px,45vw);padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}.toc{height:calc(100% - 86px);overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:28px}.toc h3{margin:0 0 8px;color:var(--gold);font-size:.76rem;letter-spacing:.08em}.toc button{width:100%;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:7px 8px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.toc button:hover,.toc button.on{background:var(--gold-soft);color:var(--ink)}.toc b{color:var(--gold);font:700 .7rem ui-monospace,monospace}
    .notes{position:fixed;z-index:18;left:50%;bottom:80px;transform:translateX(-50%);width:min(720px,calc(100% - 30px));padding:15px 19px;border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:0 14px 35px rgb(0 0 0/.14);color:var(--muted);font-size:.92rem}.notes strong{color:var(--gold);margin-right:10px}.hidden{display:none!important}.toast{position:fixed;z-index:30;left:50%;bottom:85px;transform:translateX(-50%);padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:.82rem;font-weight:700}
    @media(max-width:700px){.app{display:flex;flex-direction:column;justify-content:flex-start;padding:14px 10px 82px;overflow-y:auto}.stage{height:auto;min-height:calc(100svh - 110px);aspect-ratio:auto;max-height:none;overflow:visible}.content,.cover,.quote{height:auto;min-height:calc(100svh - 110px);padding:30px 22px 56px}.content{display:block}.heading h1{font-size:clamp(1.7rem,7.6vw,2.25rem)}.full{max-height:none;margin-top:16px;overflow:visible}.md{padding:13px 15px;font-size:.84rem;line-height:1.5}.bullet.l1{padding-left:12px}table{min-width:0;table-layout:fixed}th,td{padding:5px;font-size:.72rem;line-height:1.35;overflow-wrap:anywhere}.cover h1{font-size:clamp(2.3rem,13vw,4rem)}.quote{padding-left:24px}.dock{bottom:10px}.dock button{padding:0 9px}.dock .txt{display:none}.toc{grid-template-columns:1fr}.dlghead{align-items:stretch;flex-direction:column}.search{width:100%}}
    @media print{body{background:#fff}.app{display:block;padding:0;overflow:visible}.top,.dock,.notes,.toast{display:none!important}.stage{width:100%;max-height:none;border:0;border-radius:0;box-shadow:none}.content,.cover,.quote{break-inside:avoid}.full{overflow:hidden}}
  </style>
</head>

  <script>
    const slides=[{"id": 1, "src": 0, "part": 1, "partTitle": "생성형 AI와 AI 에이전트", "label": "PART 1. 생성형 AI와 AI 에이전트", "style": "파트 표지", "title": "AI 에이전트로 우리 부서 홈페이지 만들기", "subtitle": "시흥제일교회 교회학교 교사 교육", "body": "💡 \"방향과 책임은 사람이, 수고와 반복은 AI가\"\n\n코딩을 몰라도 우리 부서 홈페이지를 만들 수 있습니다"}, {"id": 2, "src": 1, "part": 1, "partTitle": "생성형 AI와 AI 에이전트", "label": "PART 1. 생성형 AI와 AI 에이전트", "style": "콘텐츠", "title": "오늘의 목표", "subtitle": "교사는 '무엇을 담을지' 정하고, AI 에이전트는 '만들고 고칩니다'", "body": "🎯 오늘 우리가 할 일\n* 생성형 AI와 AI 에이전트의 차이를 이해합니다\n* 부서별로 홈페이지 계획서(PRD)를 함께 씁니다\n* AI 에이전트로 직접 홈페이지를 만들고 고쳐 봅니다\n\n🌱 최종 모습\n* 아이들이 폰으로 접속해서 **함께 참여할 수 있는** 부서 홈페이지"}, {"id": 3, "src": 2, "part": 1, "partTitle": "생성형 AI와 AI 에이전트", "label": "PART 1. 생성형 AI와 AI 에이전트", "style": "콘텐츠", "title": "오늘의 수업 지도 (1/2)", "subtitle": "9단계로 이해에서 제작까지 · 진행하며 유연하게 조정합니다", "body": "| 순서 | 주제 | 형태 |\n|---|---|---|\n| 1 | 생성형 AI와 AI 에이전트 | 강의 |\n| 2 | 둘의 차이 | 강의+시연 |\n| 3 | 예시 홈페이지와 부서별 나눔 | 시연+나눔 |\n| 4 | 프론트엔드·백엔드 | 강의 |"}, {"id": 4, "src": 2, "part": 1, "partTitle": "생성형 AI와 AI 에이전트", "label": "PART 1. 생성형 AI와 AI 에이전트", "style": "콘텐츠", "title": "오늘의 수업 지도 (2/2)", "subtitle": "9단계로 이해에서 제작까지 · 진행하며 유연하게 조정합니다", "body": "| 순서 | 주제 | 형태 |\n|---|---|---|\n| 5 | 사람 vs AI 역할 | 강의+활동 |\n| 6 | 부서별 PRD | 팀 활동 |\n| 7 | 에이전트로 만들기 | 실습 |\n| 8 | 수정하기 | 실습 |\n| 9 | 추가 작업 논의 | 토론 |"}, {"id": 5, "src": 3, "part": 1, "partTitle": "생성형 AI와 AI 에이전트", "label": "PART 1. 생성형 AI와 AI 에이전트", "style": "콘텐츠", "title": "생성형 AI란?", "subtitle": "질문을 받으면 글, 그림, 소리, 코드를 새로 만들어 주는 AI", "body": "📚 비유: **도서관 사서**\n* \"이 주제에 맞는 책을 알려주세요\" ➔ 설명해 주고 콘텐츠를 만들어 줍니다\n* 질문하면 답은 주지만, **답을 받아 다음 작업으로 옮기는 건 나**입니다\n\n📝 교회학교 예시\n* \"공과 공부 질문 10개 만들어 줘\"\n* \"요한복음 3장을 초등 저학년 눈높이로 설명해 줘\"\n* \"부서 소개 문구 써 줘\""}, {"id": 6, "src": 4, "part": 1, "partTitle": "생성형 AI와 AI 에이전트", "label": "PART 1. 생성형 AI와 AI 에이전트", "style": "콘텐츠", "title": "AI 에이전트란?", "subtitle": "목표를 말하면 스스로 계획하고, 도구를 써서 끝까지 해내는 AI", "body": "🗂 비유: **일을 맡기는 비서**\n* \"책을 찾아 대출해서 가져다주세요\" ➔ 검색 ➔ 대출 ➔ 가져오기까지 알아서 합니다\n* \"홈페이지 만들어 줘\" 하면 파일을 만들고, 실행해 보고, 오류가 나면 고칩니다\n\n🔁 일하는 방식: **계획 ➔ 실행 ➔ 확인**\n* 도구: 파일 만들기와 수정, 웹 검색, 코드 실행과 확인"}, {"id": 7, "src": 5, "part": 1, "partTitle": "생성형 AI와 AI 에이전트", "label": "PART 1. 생성형 AI와 AI 에이전트", "style": "콘텐츠", "title": "세 회사 한눈에 보기", "subtitle": "구글, 앤트로픽, 오픈AI — 같은 일을 하는 세 가지 도구", "body": "| 회사 | 생성형 AI (대화·생성) | AI 에이전트 (일을 맡기는 도구) | 교사에게 쉬운 활용 |\n|---|---|---|---|\n| **구글 Google** | Gemini | Gemini CLI, Antigravity(에이전트형 개발 도구) 등 | 자료 정리는 NotebookLM, 화면 만들기는 AI Studio |\n| **앤트로픽 Anthropic** | Claude | Claude Code, Claude 데스크톱 앱의 Code 기능 | 파일을 직접 만들고 고치는 에이전트 작업 |\n| **오픈AI OpenAI** | ChatGPT | Codex 등 코딩 에이전트 | 대화 중심의 아이디어 정리, 이미지 생성 |"}, {"id": 8, "src": 6, "part": 1, "partTitle": "생성형 AI와 AI 에이전트", "label": "PART 1. 생성형 AI와 AI 에이전트", "style": "콘텐츠", "title": "세 회사를 대하는 마음", "subtitle": "경쟁이 아닌 '같은 일을 하는 세 가지 도구'", "body": "⚠️ 제품 이름과 기능은 자주 바뀝니다\n* **수업 직전에 각 회사 공식 페이지에서 현재 이름을 한 번 확인**하세요\n\n💡 수업 운영 팁\n* 세 회사는 \"경쟁\"이 아닌 **\"같은 일을 하는 세 가지 도구\"**로 설명합니다\n* 실습에는 **한 가지만** 정해서 쓰는 것을 권합니다 (혼란 방지)\n* 개념을 잡으면 어떤 도구가 나와도 응용할 수 있습니다"}, {"id": 9, "src": 7, "part": 1, "partTitle": "생성형 AI와 AI 에이전트", "label": "PART 1. 생성형 AI와 AI 에이전트", "style": "콘텐츠", "title": "AI, 구분하면 더 잘 쓸 수 있어요", "subtitle": "회사 · 대화형 AI · 작업용 에이전트", "body": "| 구분 | 구글 | 앤트로픽 | 오픈AI |\n|---|---|---|---|\n| 대화형 생성 AI | 제미나이 | 클로드 | 챗GPT |\n| 대표 작업용 에이전트 | 안티그래비티 | 클로드 코드 | 코덱스 |"}, {"id": 10, "src": 8, "part": 2, "partTitle": "생성형 AI vs AI 에이전트", "label": "PART 2. 생성형 AI vs AI 에이전트", "style": "파트 표지", "title": "생성형 AI와 AI 에이전트의 차이", "subtitle": "'말'을 하는 AI와 '일'을 하는 AI", "body": "Generative AI vs AI Agent\n\n도서관 사서 vs 일을 맡기는 비서"}, {"id": 11, "src": 9, "part": 2, "partTitle": "생성형 AI vs AI 에이전트", "label": "PART 2. 생성형 AI vs AI 에이전트", "style": "콘텐츠", "title": "한눈에 보는 차이", "subtitle": "", "body": "| 구분 | 생성형 AI | AI 에이전트 |\n|---|---|---|\n| 하는 일 | 요청에 **답을 만들어 줌** | 목표를 **끝까지 수행함** |\n| 움직임 | 한 번 묻고 한 번 답함 | 계획 → 실행 → 확인 → 수정을 **반복** |\n| 도구 사용 | 주로 글로 답함 | 파일 만들기, 웹 검색, 코드 실행 등 **직접 사용** |\n| 결과물 | 복사해서 내가 붙여 넣어야 함 | **완성된 파일·폴더**가 만들어짐 |\n| 비유 | 도서관 사서 | 일을 맡기는 비서 |"}, {"id": 12, "src": 10, "part": 2, "partTitle": "생성형 AI vs AI 에이전트", "label": "PART 2. 생성형 AI vs AI 에이전트", "style": "콘텐츠", "title": "교회학교 장면으로 비교하기", "subtitle": "같은 부탁, 전혀 다른 결과", "body": "💬 생성형 AI에게\n* \"부서 소개글 써 줘\" ➔ 글만 받습니다. 붙여 넣는 건 내 몫입니다\n\n🛠 AI 에이전트에게\n* \"부서 홈페이지 만들어 줘\" ➔ 페이지 파일이 폴더에 생기고 브라우저에서 바로 열립니다"}, {"id": 13, "src": 11, "part": 2, "partTitle": "생성형 AI vs AI 에이전트", "label": "PART 2. 생성형 AI vs AI 에이전트", "style": "콘텐츠", "title": "시연: 같은 요청, 두 가지 결과", "subtitle": "같은 요청을 두 방식으로 보여 드립니다", "body": "🎬 시연 순서\n* ① 채팅 AI에 \"초등부 소개 페이지 만들어 줘\" ➔ 코드 글이 나오고, 사람이 붙여 넣어야 함\n* ② 에이전트에게 같은 요청 ➔ 폴더에 파일이 생기고 브라우저에서 바로 열림\n\n👀 차이가 눈으로 보입니다\n* 결과물이 '말'인지 '파일'인지 비교해 보세요"}, {"id": 14, "src": 12, "part": 2, "partTitle": "생성형 AI vs AI 에이전트", "label": "PART 2. 생성형 AI vs AI 에이전트", "style": "콘텐츠", "title": "여러 단계의 작업을 맡길 때 유용해요", "subtitle": "에이전트가 빛나는 순간", "body": "🎬 이런 일에 좋아요\n* **쇼츠 제작**\n* **웹앱 만들기** (우리 부서 홈페이지!)\n* **반복 업무 자동화**\n\n🔌 단, 작업에 맞는 **도구 연결과 권한**이 필요합니다"}, {"id": 15, "src": 13, "part": 2, "partTitle": "생성형 AI vs AI 에이전트", "label": "PART 2. 생성형 AI vs AI 에이전트", "style": "콘텐츠", "title": "요즘은 교집합이 커지고 있어요", "subtitle": "대화형 AI에도 실행 기능이 들어오고 있습니다", "body": "🔄 경계가 흐려지고 있어요\n* 대화형 AI에도 **실행 기능**이 들어오고 있어요\n* 생성형 AI로도 제작은 가능해요\n* 에이전트는 **여러 단계 실행**에 강점이에요\n\n👀 이름보다 **'어디까지 실행해 주는가'**를 보세요"}, {"id": 16, "src": 14, "part": 2, "partTitle": "생성형 AI vs AI 에이전트", "label": "수업 마무리", "style": "마무리 슬로건", "title": "생성형 AI는 '말'을 하고, 에이전트는 '일'을 한다", "subtitle": "단, 에이전트도 방향은 사람이 정해야 합니다.", "body": "\"무엇을 왜 만들지는 언제나 교사의 몫입니다.\""}, {"id": 17, "src": 15, "part": 3, "partTitle": "예시 홈페이지와 부서별 나눔", "label": "PART 3. 예시 홈페이지와 부서별 나눔", "style": "파트 표지", "title": "예시 홈페이지와 부서별 나눔", "subtitle": "라온동행교회 홈페이지 (raondonghaeng.org)", "body": "SHOW & SHARE\n\n보고, 나누고, 우리 부서에 맞게 상상하기"}, {"id": 18, "src": 16, "part": 3, "partTitle": "예시 홈페이지와 부서별 나눔", "label": "PART 3. 예시 홈페이지와 부서별 나눔", "style": "콘텐츠", "title": "예시 홈페이지의 구성", "subtitle": "라온동행교회 홈페이지 메뉴", "body": "| 메뉴 | 담긴 내용 |\n|---|---|\n| 예배안내 | 예배 시간과 장소 |\n| 처음 오셨나요? | 처음 방문한 가정을 위한 안내 |\n| 우리교회 | 교회 소개 |\n| 이번 주 말씀 | 말씀 영상과 말씀 쇼츠 |\n| 교회소식 · 주보 | 공지와 주보 |\n| 사진첩 · 오시는 길 | 공동체 사진, 찾아오는 방법 |"}, {"id": 19, "src": 17, "part": 3, "partTitle": "예시 홈페이지와 부서별 나눔", "label": "PART 3. 예시 홈페이지와 부서별 나눔", "style": "콘텐츠", "title": "보면서 이야기해 봅시다", "subtitle": "", "body": "🔍 눈여겨볼 점\n* 처음 온 사람이 **가장 궁금해할 것**(시간, 장소, 안내)을 맨 앞에 두었습니다\n* 말씀 쇼츠 등 **짧은 영상**으로 부담 없이 접근합니다\n* 사진첩과 소식으로 **살아 있는 공동체**임을 보여 줍니다\n\n💡 상상해 보기\n* 지금 사이트에는 부서 전용 페이지가 없습니다\n* \"우리 부서는 이런 페이지를 따로 만들 수 있다면?\""}, {"id": 20, "src": 18, "part": 3, "partTitle": "예시 홈페이지와 부서별 나눔", "label": "PART 3. 예시 홈페이지와 부서별 나눔", "style": "콘텐츠", "title": "부서별 나눔 · 공통 질문 5가지", "subtitle": "자료를 모으며 함께 답해 보세요", "body": "📝 우리 부서에 대해\n* 어떤 아이들이 모이나요? (나이, 인원, 분위기)\n* 부모님은 무엇을 가장 궁금해하나요? (시간, 장소, 준비물, 행사)\n* 아이들이 집에서도 **하고 싶어 할 것**은? (퀴즈, 암송, 색칠, 영상)\n* 이번 달 꼭 알려야 할 것은?\n* 사진·이름은 어디까지 공개해도 되나요? (**초상권·개인정보**)"}, {"id": 21, "src": 19, "part": 3, "partTitle": "예시 홈페이지와 부서별 나눔", "label": "PART 3. 예시 홈페이지와 부서별 나눔", "style": "콘텐츠", "title": "부서별 아이디어 예시", "subtitle": "아이들이 함께할 수 있는 코너", "body": "| 부서 | 소개 | 아이들이 함께할 수 있는 코너 |\n|---|---|---|\n| 영유아·유치부 | 부모님과 함께 보는 페이지 | 노래·율동 영상, 오늘 배운 말씀 그림, 부모 안내 |\n| 유초등부 | 활동 중심 | 말씀 퀴즈, 암송 도전 체크, 오늘의 공과 요약, 갤러리 |\n| 소년부(고학년) | 도전·성장 | 성경 인물 카드, 퀴즈 랭킹, 감사 나눔 게시판 |\n| 중고등부 | 자기 표현 | 묵상 한 줄 나눔, 행사 신청, 찬양 플레이리스트 |\n| 청년부 | 공동체 소개 | 모임 안내, 소그룹 신청, 간증 |"}, {"id": 22, "src": 20, "part": 3, "partTitle": "예시 홈페이지와 부서별 나눔", "label": "PART 3. 예시 홈페이지와 부서별 나눔", "style": "콘텐츠", "title": "자료 모으기", "subtitle": "수업 전에 미리 준비하면 좋고, 못 했어도 수업 중에 함께 모읍니다", "body": "📁 부서 폴더에 담을 것\n* 사진 (**동의받은 사진만**)\n* 행사 일정\n* 공과 주제\n* 부서 소개 문장\n* 연락처 (교사 공용 연락처만)\n* 아이들이 좋아하는 노래·영상 링크"}, {"id": 23, "src": 21, "part": 4, "partTitle": "프론트엔드와 백엔드", "label": "PART 4. 프론트엔드와 백엔드", "style": "파트 표지", "title": "프론트엔드와 백엔드 이해하기", "subtitle": "어려운 용어, '식당 비유'로 쉽게", "body": "Frontend & Backend\n\n손님이 보는 홀과, 보이지 않는 주방"}, {"id": 24, "src": 22, "part": 4, "partTitle": "프론트엔드와 백엔드", "label": "PART 4. 프론트엔드와 백엔드", "style": "콘텐츠", "title": "식당으로 이해하기", "subtitle": "", "body": "| 용어 | 식당 비유 | 홈페이지에서는 |\n|---|---|---|\n| **프론트엔드** | 손님이 보는 **홀·메뉴판·인테리어** | 화면, 글자, 색, 버튼, 사진 |\n| **백엔드** | 손님이 못 보는 **주방·창고·장부** | 데이터 저장, 로그인, 퀴즈 점수 기록, 게시글 저장 |\n| **데이터베이스** | 주방의 **재료 창고/주문 장부** | 아이들 이름, 점수, 글을 보관하는 곳 |\n| **배포(호스팅)** | **가게 문을 여는 것** | 인터넷 주소로 누구나 접속하게 하기 |"}, {"id": 25, "src": 23, "part": 4, "partTitle": "프론트엔드와 백엔드", "label": "PART 4. 프론트엔드와 백엔드", "style": "콘텐츠", "title": "처음에는 프론트엔드만으로 충분합니다", "subtitle": "소개, 일정, 사진, 영상, 퀴즈는 백엔드 없이 가능합니다", "body": "✅ 1단계: 보여 주는 홈페이지\n* 부서 소개, 일정, 사진, 영상, 말씀 퀴즈\n\n⚠️ 2단계: 참여 기능\n* 아이들이 **글을 남기거나 점수를 저장**하려면 백엔드가 필요합니다\n* 이때부터 **개인정보 책임**이 생기므로 신중히 결정합니다\n\n👉 권장 순서: 1단계를 먼저 완성한 뒤 2단계를 논의합니다"}, {"id": 26, "src": 24, "part": 5, "partTitle": "사람이 할 일, AI가 할 일", "label": "PART 5. 사람이 할 일, AI가 할 일", "style": "파트 표지", "title": "사람이 할 일, AI가 할 일", "subtitle": "역할을 나누면 일이 쉬워집니다", "body": "Human & AI\n\n방향과 책임은 사람이, 수고와 반복은 AI가"}, {"id": 27, "src": 25, "part": 5, "partTitle": "사람이 할 일, AI가 할 일", "label": "PART 5. 사람이 할 일, AI가 할 일", "style": "콘텐츠", "title": "역할 나누기", "subtitle": "", "body": "| 사람(교사)이 할 일 | AI 에이전트가 할 일 |\n|---|---|\n| **왜** 만드는지, 누구를 위한 것인지 정하기 | 화면 코드 작성, 파일 구성 |\n| 아이들 눈높이와 **신앙적 내용**의 옳고 그름 판단 | 문구 초안, 퀴즈 후보, 디자인 시안 |\n| 사진·이름 공개 **허락과 개인정보 결정** | 오류 찾기와 수정 반복 |\n| **성경 내용 검토** (AI는 틀릴 수 있음) | 여러 버전을 빠르게 만들어 비교용 제공 |\n| 최종 승인, 공개 여부 결정 | 수정 요청 즉시 반영 |\n| 아이들과 부모와의 **관계와 돌봄** | (대신할 수 없음) |"}, {"id": 28, "src": 26, "part": 5, "partTitle": "사람이 할 일, AI가 할 일", "label": "PART 5. 사람이 할 일, AI가 할 일", "style": "콘텐츠", "title": "활동: 사람? AI?", "subtitle": "포스트잇에 적어 나눠 붙여 보세요", "body": "🗂 방법\n* 포스트잇에 부서 홈페이지 일을 하나씩 적습니다 (예: 공과 요약 쓰기, 사진 공개 결정, 버튼 색 정하기)\n* '사람' / 'AI' 두 칸으로 나눠 붙입니다\n* 헷갈리는 것은 함께 이야기해 봅니다"}, {"id": 29, "src": 27, "part": 5, "partTitle": "사람이 할 일, AI가 할 일", "label": "PART 5. 사람이 할 일, AI가 할 일", "style": "콘텐츠", "title": "꼭 지킬 안전 원칙 3가지", "subtitle": "교사의 책임입니다", "body": "🛡 우리의 약속\n* 아이 얼굴·실명·연락처는 **부모 동의 없이 올리지 않습니다**\n* AI가 쓴 성경·교리 설명은 **반드시 교사가 확인**합니다\n* 비밀번호·API 키는 AI 채팅창에 **붙여 넣지 않습니다**"}, {"id": 30, "src": 28, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "파트 표지", "title": "PRD 작성 도우미로 부서 설계도 만들기", "subtitle": "질문에 답만 하면 PRD가 완성됩니다", "body": "PRD Practice\n\n설계도도 AI가 도와줍니다"}, {"id": 31, "src": 29, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "PRD란?", "subtitle": "\"뭘 만들지 미리 적어둔 설계도\" · AI 에이전트에게 주는 업무 지시서", "body": "| 항목 | 내용 |\n|---|---|\n| 1 · 왜 만드는가 | 개요, 목표 — 우리 부서 홈페이지가 필요한 이유 |\n| 2 · 누가 쓰는가 | 아이, 부모, 교사. 기능과 디자인의 기준 |\n| 3 · 무엇을 만드는가 | 꼭 들어갈 기능과 화면 구성 |\n| 4 · 어떻게 사용하는가 | 아이가 폰으로 열어 퀴즈를 푸는 것 같은 사용 장면 |\n| 5 · 무엇으로 만드는가 | 기술 스택. 처음에는 AI 추천을 받아도 됩니다 |"}, {"id": 32, "src": 30, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "가장 중요한 항목: '만들지 않을 것'", "subtitle": "범위를 정해 두지 않으면 AI가 과하게 만들어 복잡해집니다", "body": "🚫 \"이번엔 이건 안 만든다\"를 적는 것이 PRD에서 가장 중요합니다\n* 아이들의 **실명, 얼굴 사진, 연락처**\n* **로그인**과 **글 남기기**\n* 결제나 헌금 기능\n\n💡 설계도를 잘 쓰면 AI가 훨씬 잘 만듭니다. 그런데 설계도 쓰는 것도 AI가 도와줍니다"}, {"id": 33, "src": 31, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "PRD 작성 도우미란?", "subtitle": "AI에게 '직무기술서'를 준 것", "body": "🧑‍💼 친절한 IT 기획자(PM) 역할의 AI입니다\n* 8단계 질문을 **한 번에 하나씩** 묻습니다\n* 마지막에 코딩 에이전트가 바로 읽는 **PRD 파일**을 만들어 줍니다\n\n🔁 흐름: **세팅 ➔ 대화 ➔ 수령 ➔ 에이전트로 넘기기**\n* 한 번 세팅해 두면 각 부서가 자기 부서의 PRD를 만들 수 있습니다\n* 다 함께 세팅하고, 부서별로 대화합니다"}, {"id": 34, "src": 32, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "0단계 · 도우미 세팅하기", "subtitle": "두 방법 중 편한 걸 고릅니다", "body": "| 방법 | 순서 |\n|---|---|\n| **A · Google AI Studio** | aistudio.google.com 로그인 ➔ 왼쪽 **Chat** 선택 (Build가 아님) ➔ **System Instructions** 칸에 지침 붙여넣기 ➔ \"시작\" 입력 |\n| **B · Gemini Gem** | gemini.google.com ➔ Gem 관리자 ➔ 새 Gem ➔ 이름 \"PRD 작성 도우미\" ➔ 지침 칸에 붙여넣고 저장 |\n| Claude · ChatGPT | 지침을 **첫 메시지로 붙여넣고** 시작 |"}, {"id": 35, "src": 33, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠 프롬프트", "title": "도우미 지침 (간단판)", "subtitle": "지침 칸에 붙여넣으세요 · 전문은 랜딩페이지에 있습니다", "body": "너는 교회학교 부서 홈페이지의 PRD 작성 도우미(친절한 IT 기획자)야. 사용자는 코딩을 몰라. 쉬운 말로 설명해.\n처음엔 \"어느 부서의 홈페이지인지, 이름을 알려주세요\"라고만 인사해.\n아래 8단계를 한 번에 하나씩만 물어봐: 개요, 사용자 시나리오(아이·부모·교사), 핵심 기능, 기술 스택(모르면 추천), 화면 구성, 상세 기능, 디자인, 제약 사항(만들지 않을 것).\n모른다고 하면 선택지 2~4개를 줘.\n아이들의 실명·얼굴 사진·연락처·로그인·글 남기기는 넣지 않게 안내하고, 성경 내용은 교사가 확인해야 한다고 적어줘.\n끝나면 AI 코딩 에이전트가 읽을 PRD.md를 만들고, 맨 위에 '코드 쓰기 전에 계획부터 보여달라'는 요청문을 넣어줘."}, {"id": 36, "src": 34, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "1단계 · 도우미와 대화 시작하기", "subtitle": "부서별로 모여 화면 하나를 함께 봅니다", "body": "⌨️ 아무 말이나 입력합니다: \"시작할게요\"\n\n✅ 확인할 점\n* 도우미가 **정해진 인사말**로 시작하나요?\n* 아니라면 지침이 제대로 붙여넣어졌는지 확인하세요"}, {"id": 37, "src": 35, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "2단계 · 8단계 질문에 답하기 (1/2)", "subtitle": "유초등부 예시 답변", "body": "| 순서 | 도우미가 묻는 것 | 예시 답변 |\n|---|---|---|\n| 1 | 프로젝트 개요 | 유초등부 아이들이 말씀을 복습하고 부모님이 소식을 보는 홈페이지 |\n| 2 | 사용자 시나리오 | 아이는 퀴즈, 부모님은 일정 확인, 교사는 매주 수정 |\n| 3 | 핵심 기능 | 부서 소개, 이번 달 일정, 오늘의 말씀 요약, 말씀 퀴즈 |\n| 4 | 기술 스택 | **\"잘 모르겠어요\"** ➔ 도우미 추천 받기 |"}, {"id": 38, "src": 35, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "2단계 · 8단계 질문에 답하기 (2/2)", "subtitle": "유초등부 예시 답변", "body": "| 순서 | 도우미가 묻는 것 | 예시 답변 |\n|---|---|---|\n| 5 | 화면 구성 | 홈, 소개, 일정, 오늘의 말씀, 퀴즈, 사진 |\n| 6 | 상세 기능 | 홈 상단에 모임 시간 크게, 퀴즈는 3문제 |\n| 7 | 디자인 가이드 | 밝은 노랑, 큰 글씨, 모바일 우선 |\n| 8 | 제약 사항 | **실명·얼굴 사진·연락처 없음, 로그인 없음, 글 남기기 없음** |"}, {"id": 39, "src": 36, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "2단계 · 진행 팁", "subtitle": "막혀도 괜찮아요", "body": "💬 모르는 질문은 **\"잘 모르겠어요\"**\n* 도우미가 2~4개 선택지를 줍니다\n* 4번 '기술 스택'은 몰라도 되니 추천을 받으세요\n\n🚫 8번 '제약 사항'에서 **\"이건 안 만든다\"를 분명히** 정하세요\n\n👶 의견이 갈리면 먼저 **아이들 눈높이**에서 결정합니다"}, {"id": 40, "src": 37, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠 프롬프트", "title": "3단계 · PRD 받기", "subtitle": "대화가 충분히 진행됐을 때 입력하세요", "body": "이제 지금까지 내용을 바탕으로 PRD를 만들어줘.\nAI 코딩 에이전트가 읽을 수 있게 .md 파일(또는 코드 블록)로 정리해줘.\n맨 위에는 '코드를 쓰기 전에 계획부터 보여달라'는 요청문을 넣어줘."}, {"id": 41, "src": 38, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "PRD.md 저장과 확인", "subtitle": "파일이면 그대로, 코드 블록이면 메모장에 붙여넣어 저장", "body": "💾 저장 방법\n* 파일로 받으면 그대로 저장합니다\n* 코드 블록으로 받으면 복사해 메모장에 붙여넣고 **`PRD.md`**로 저장합니다\n\n✅ 확인할 점\n* **개요 / 기술 스택 / 작업 목록 / 화면별 명세 / 만들지 않을 것**이 있나요?\n* 맨 위에 **에이전트에게 보내는 요청문**이 있나요?\n* **아이들 개인정보를 넣지 않는다**는 내용이 있나요?"}, {"id": 42, "src": 39, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠 프롬프트", "title": "4단계 · AI 에이전트로 넘기기", "subtitle": "PRD.md를 부서 프로젝트 폴더에 넣고 입력하세요", "body": "같은 폴더에 있는 PRD.md 파일을 읽고, 이 계획대로 우리 부서 홈페이지를\n만드는 계획을 먼저 세워줘. 아직 코드는 쓰지 말고 검토받고 싶어."}, {"id": 43, "src": 40, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "도우미 없이 직접 쓰고 싶다면 (1/2)", "subtitle": "PRD.md 양식 · A4 한 장", "body": "📝 기본 정보\n* 부서 이름\n* 만드는 이유 (한 문장)\n* 누가 쓰는가 (아이 / 부모 / 교사)\n* 아이들의 나이와 특징\n* 홈페이지 분위기 (색, 느낌)"}, {"id": 44, "src": 40, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "도우미 없이 직접 쓰고 싶다면 (2/2)", "subtitle": "PRD.md 양식 · A4 한 장", "body": "📑 꼭 들어갈 페이지 (3~5개)\n* 부서 소개 / 이번 달 일정 / 오늘의 말씀과 공과 요약 / 아이들 코너 / 사진 갤러리 (동의받은 사진만)"}, {"id": 45, "src": 41, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "직접 쓰는 양식 · 나머지 항목", "subtitle": "넣지 않을 것과 완성 기준", "body": "🎮 아이들이 할 수 있는 것 (1~2개만)\n\n🚫 넣지 않을 것\n* 개인정보, 실명, 연락처, 로그인, 글 남기기\n\n📦 준비한 자료\n* 사진, 문서, 영상 링크\n\n🏁 완성 기준\n* 예: \"아이가 폰으로 열어 퀴즈를 풀 수 있다\""}, {"id": 46, "src": 42, "part": 6, "partTitle": "PRD 작성 실습", "label": "PART 6. PRD 작성 실습", "style": "콘텐츠", "title": "진행 방법 · 마무리 체크", "subtitle": "부서별로 함께 채워 갑니다", "body": "👥 부서별 4~6명 · 진행자 / 기록자 / 자료 담당 / 발표자\n* 화면 하나를 함께 보며 의견을 모아 답하고, 입력은 기록자가 맡습니다\n* 부서별로 짧게 발표하고, 다른 부서가 질문을 하나씩 합니다\n\n☑️ 마무리 체크\n* 8단계 질문에 답했다 · **만들지 않을 것**을 정했다\n* **PRD.md**로 저장해 부서 프로젝트 폴더에 넣었다"}, {"id": 47, "src": 43, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "파트 표지", "title": "AI 에이전트로 홈페이지 만들기", "subtitle": "계획서를 들고 이제 만들어 봅니다", "body": "Build with an AI Agent\n\n작게 시작해서 하나씩 키워 가기"}, {"id": 48, "src": 44, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "준비물 (1/2)", "subtitle": "수업 전에 미리 준비해 주세요", "body": "🎒 체크리스트\n* 노트북(권장), 인터넷\n* 사용할 AI 에이전트 도구 1개 (설치와 로그인은 **수업 전에 미리**)\n* 부서 PRD.md, 자료 폴더 (사진, 글)\n* 새 프로젝트 폴더 하나 (예: `우리부서-홈페이지`) 안에 PRD.md 넣기"}, {"id": 49, "src": 44, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "준비물 (2/2)", "subtitle": "수업 전에 미리 준비해 주세요", "body": "🧭 진행 방식은 강사가 고릅니다\n* **전원 실습**: 설치가 모두 끝났을 때\n* **강사 시연 + 관심자 병행**: 설치 미완료자가 있을 때 (초보자 대상이면 권장)"}, {"id": 50, "src": 45, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "만드는 6단계", "subtitle": "한 단계씩 확인하며 나아갑니다", "body": "| 단계 | 내용 |\n|---|---|\n| 1 | **계획 먼저 받기** (Plan) |\n| 2 | 홈페이지 생성 |\n| 3 | 우리 부서 정보 채우기 |\n| 4 | 디자인과 모바일 화면 다듬기 |\n| 5 | 일정·공지·아이들 코너 추가 |\n| 6 | 배포 방법 확인 |"}, {"id": 51, "src": 46, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "1단계 · 계획 먼저 받기 (이 실습의 핵심)", "subtitle": "코드를 쓰기 전에 에이전트의 계획부터 읽습니다", "body": "🗺 이렇게 요청합니다\n* \"PRD.md를 읽고, **코드는 쓰지 말고** 페이지 구성과 작업 순서를 먼저 정리해 줘.\"\n\n✂️ 계획이 마음에 안 들면 이 단계에서 고칩니다\n* 페이지를 빼거나, 순서를 바꾸거나, 더하고 싶은 것을 말합니다\n* 계획이 좋아야 결과물도 좋습니다"}, {"id": 52, "src": 47, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "2단계 · 홈페이지 생성", "subtitle": "가장 작은 버전부터", "body": "🏗 요청 예시\n* \"간단한 정적 웹사이트(HTML/CSS)로 만들어 줘. 한국어, 모바일 반응형.\"\n* \"실제 사진이 없으니 자리표시 이미지를 넣어 줘.\"\n* \"완성되면 미리보기를 보여 줘.\""}, {"id": 53, "src": 48, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "3단계 · 우리 부서 정보 채우기", "subtitle": "모아 온 자료를 넣어 봅니다", "body": "✍️ 넣을 내용\n* 부서 이름, 소개 문장, 표어\n* 예배·모임 시간과 장소\n* 이번 달 일정, 오늘의 공과 요약\n* 교회 공식 채널의 영상 링크\n\n🛡 **교인·아이 개인정보는 올리지 않습니다.** 교사 공용 연락처만 사용합니다"}, {"id": 54, "src": 49, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "4단계 · 디자인과 모바일 화면", "subtitle": "아이들은 대부분 폰으로 봅니다", "body": "🎨 요청 예시\n* \"메인 색은 우리 부서 느낌(예: 밝은 노랑)으로, 강조색은 하나만 써 줘.\"\n* \"모바일에서는 햄버거 메뉴와 누르기 편한 큰 버튼으로 해 줘.\"\n* \"상단에 모임 시간과 오시는 길 바로가기 버튼을 크게 넣어 줘.\"\n\n📱 확인: PC와 폰 화면을 둘 다 열어 레이아웃이 깨지지 않는지 봅니다"}, {"id": 55, "src": 50, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "5단계 · 아이들 코너와 안내 추가", "subtitle": "재미와 안내를 함께", "body": "🧩 추가 예시\n* 말씀 퀴즈 3문제, 암송 도전 체크 (저장 없이 화면에서만 동작)\n* 오시는 길: 네이버 지도·카카오맵 길찾기 버튼, 대중교통과 주차 안내\n* 새가족 안내 문의 (연락처는 교사 공용 번호)\n\n🔗 지도 링크는 **눌러서 실제 위치로 연결되는지** 꼭 확인합니다"}, {"id": 56, "src": 51, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "6단계 · 배포 (인터넷에 공개하기) (1/3)", "subtitle": "가장 쉬운 길부터", "body": "🌐 배포의 흐름\n* **내 컴퓨터**: 나만 보고 고치는 단계\n* **GitHub**: 코드를 보관하는 곳 (아이들 정보 저장소가 아닙니다)\n* **Vercel · Netlify**: 인터넷에 공개하는 곳 ➔ **공개 주소**"}, {"id": 57, "src": 51, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "6단계 · 배포 (인터넷에 공개하기) (2/3)", "subtitle": "가장 쉬운 길부터", "body": "\n🙌 터미널 명령을 직접 칠 필요는 없습니다\n* 에이전트에게 \"GitHub에 올려 줘\"라고 하면 준비하고 승인 버튼을 띄웁니다"}, {"id": 58, "src": 51, "part": 7, "partTitle": "에이전트로 홈페이지 만들기", "label": "PART 7. 에이전트로 홈페이지 만들기", "style": "콘텐츠", "title": "6단계 · 배포 (인터넷에 공개하기) (3/3)", "subtitle": "가장 쉬운 길부터", "body": "* git이 부담스러우면 완성된 폴더를 Netlify Drop에 끌어다 놓는 방법도 있습니다\n* 전용 도메인 구입은 이번 수업에서 다루지 않고 다음으로 미룹       const overflow=()=>full.scrollHeight>full.clientHeight+2||stage.scrollHeight>stage.clientHeight+2;
      let scale=1;
      const apply=()=>{base.forEach(({el,size})=>{const floor=el===title?26:el===sub?16:el===md?17:14;el.style.fontSize=Math.max(floor,size*scale)+'px'});cells.forEach(el=>el.style.padding=Math.max(4,12*scale)+'px');section.style.paddingTop=Math.max(18,pad.top*scale)+'px';section.style.paddingBottom=Math.max(34,pad.bottom*scale)+'px';section.style.paddingLeft=Math.max(24,pad.left*scale)+'px';section.style.paddingRight=Math.max(24,pad.right*scale)+'px'};
      while(overflow()&&scale>.72){scale-=.04;apply()}
      if(overflow()){section.classList.add('ultra-fit');while(overflow()&&scale>.62){scale-=.03;apply()}}
      if(overflow())full.style.overflow='auto';
    }
    function render(){const s=slides[current];$('part').textContent='PART '+s.part+' · '+s.partTitle;$('topTitle').textContent=s.title;$('count').textContent=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('noteText').textContent=s.style+' · '+s.subtitle;let body='';if(cover(s)){body='<section class="cover"><p class="eyebrow">PART '+s.part+' · '+esc(s.partTitle)+'</p><h1>'+inline(s.title)+'</h1><p class="sub">'+inline(s.subtitle)+'</p>'+markdown(s.body,true)+'<footer class="foot"><span>AI 에이전트로 우리 부서 홈페이지 만들기</span><span>'+String(s.id).padStart(2,'0')+'</span></footer></section>'}else if(quote(s)){body='<section class="quote"><p class="eyebrow">'+inline(s.label)+'</p><span class="qmark">“</span><h1>'+inline(s.title)+'</h1><p class="sub">'+inline(s.subtitle)+'</p>'+markdown(s.body,true)+'<footer class="foot"><span>AI 에이전트로 우리 부서 홈페이지 만들기</span><span>'+String(s.id).padStart(2,'0')+'</span></footer></section>'}else{const copy=s.style.includes('프롬프트')?'<button onclick="copySlide()" style="float:right;border:0;border-radius:8px;padding:8px 12px;background:var(--gold-soft);color:var(--ink);font-weight:750;cursor:pointer">프롬프트 복사</button>':'';body='<section class="content"><header class="heading"><p class="eyebrow">'+inline(s.label)+'</p>'+copy+'<h1>'+inline(s.title)+'</h1><p>'+inline(s.subtitle)+'</p></header><div class="full">'+markdown(s.body)+'</div><footer class="foot"><span>AI 에이전트로 우리 부서 홈페이지 만들기</span><span>'+String(s.id).padStart(2,'0')+'</span></footer></section>'}$('stage').innerHTML=body;history.replaceState(null,'','#slide-'+(current+1));renderToc($('search').value);requestAnimationFrame(()=>requestAnimationFrame(fitSlide))}
    function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()} function copySlide(){const s=slides[current];navigator.clipboard.writeText(s.title+'\n'+s.subtitle+'\n\n'+s.body);$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1500)}
    function renderToc(q=''){const term=q.trim().toLowerCase(),groups=[];for(let p=1;p<=9;p++){const list=slides.filter(s=>s.part===p&&(!term||(s.title+' '+s.subtitle+' '+s.label+' '+s.body).toLowerCase().includes(term)));if(!list.length)continue;groups.push('<section><h3>PART '+p+' · '+esc(list[0].partTitle)+'</h3>'+list.map(s=>'<button class="'+(s.id===current+1?'on':'')+'" onclick="go('+(s.id-1)+');tocDialog.close()"><b>'+String(s.id).padStart(2,'0')+'</b><span>'+inline(s.title)+'</span></button>').join('')+'</section>')}$('toc').innerHTML=groups.join('')}
    $('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('tocBtn').onclick=()=>{$('tocDialog').showModal();renderToc($('search').value)};$('search').oninput=e=>renderToc(e.target.value);$('noteBtn').onclick=()=>$('notes').classList.toggle('hidden');$('theme').onclick=()=>document.documentElement.classList.toggle('dark');$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key.toLowerCase()==='o')$('tocBtn').click();else if(e.key.toLowerCase()==='n')$('noteBtn').click()});let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,100)});addEventListener('beforeprint',fitSlide);
    const hash=location.hash.match(/slide-(\d+)/);if(hash)current=Math.max(0,Math.min(slides.length-1,Number(hash[1])-1));render();if(document.fonts)document.fonts.ready.then(fitSlide);
  </script>
</body>
