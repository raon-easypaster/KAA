<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>아동센터 평가 대비 AI 실무교육</title>
  <meta name="description" content="아동센터 평가 대비 관찰·상담일지, 월간 소식지, 달란트 특이사항 자동화를 위한 26장 실무교육">
  <style>
    :root{--bg:#e9e6df;--paper:#fbfaf6;--card:#fff;--surface:#f1efe8;--ink:#17221e;--muted:#66706a;--line:#d8d6ce;--gold:#c7943a;--gold-soft:#efe0bd;--moss:#4d6a5c;--coral:#ba654d;--shadow:0 28px 72px rgb(23 34 30/.17)}
    html.dark{--bg:#0f1714;--paper:#17211d;--card:#1d2924;--surface:#25312c;--ink:#e7e9e3;--muted:#abb5af;--line:#34413b;--gold:#e0b45f;--gold-soft:#4a4029;--moss:#87a293;--coral:#d98a71;--shadow:0 28px 72px rgb(0 0 0/.42)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}button,input{font:inherit}
    body{background:radial-gradient(circle at 10% 8%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 27rem),radial-gradient(circle at 88% 86%,color-mix(in srgb,var(--moss) 12%,transparent),transparent 30rem),var(--bg)}
    .app{min-height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,2vh,24px);padding:clamp(18px,2.6vw,38px) clamp(20px,4.5vw,76px) 96px;overflow:hidden;position:relative}
    .top{width:min(1280px,100%);margin:auto;display:flex;align-items:end;justify-content:space-between;gap:20px}.top p{margin:0 0 4px;color:var(--gold);font-size:.75rem;font-weight:850;letter-spacing:.12em}.top span{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top strong{font:800 .9rem ui-monospace,monospace;white-space:nowrap}.top i{color:var(--line);font-style:normal}
    .stage{width:min(1280px,100%);max-height:calc(100svh - 164px);aspect-ratio:16/9;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:clamp(14px,2vw,26px);box-shadow:var(--shadow);overflow:hidden;position:relative}
    .content,.cover,.quote{height:100%;padding:clamp(28px,4.4vw,70px) clamp(30px,5.2vw,84px) clamp(54px,6vw,86px);position:relative}.content{display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,1.8vw,24px)}.content.ultra-fit{gap:6px}.content.ultra-fit .eyebrow{margin-bottom:5px}.content.ultra-fit .heading>p:last-child{margin-top:5px;line-height:1.3}.content.ultra-fit .md{line-height:1.34}.content.ultra-fit th,.content.ultra-fit td{line-height:1.22}.content.ultra-fit .bullet{padding-top:2px;padding-bottom:2px}.eyebrow{margin:0 0 clamp(10px,1.4vw,20px);color:var(--gold);font-size:clamp(.65rem,1vw,.92rem);font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .heading h1{margin:0;max-width:1050px;font-size:clamp(1.85rem,3.45vw,3.6rem);font-weight:850;letter-spacing:-.045em;line-height:1.1;text-wrap:balance}.heading>p:last-child{margin:clamp(8px,1.3vw,18px) 0 0;max-width:980px;color:var(--muted);font-size:clamp(.95rem,1.55vw,1.34rem);font-weight:560;line-height:1.5}
    .full{min-height:0;max-height:none;margin-top:0;overflow:hidden;border:1px solid var(--line);border-radius:clamp(12px,1.5vw,18px);background:color-mix(in srgb,var(--card) 94%,var(--gold-soft));scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
    .md{padding:clamp(14px,2.2vw,28px) clamp(16px,2.6vw,34px);font-size:clamp(.82rem,1.45vw,1.28rem);font-weight:530;line-height:1.55}.md strong{font-weight:820}.md em{color:color-mix(in srgb,var(--ink) 80%,var(--gold))}.md code{padding:.12em .4em;border-radius:5px;background:var(--surface);color:var(--coral);font:700 .92em ui-monospace,monospace}.md a{color:var(--moss);font-weight:760;text-decoration-thickness:1.5px;text-underline-offset:.18em}.md a:hover{color:var(--gold)}
    .bullet{display:grid;grid-template-columns:18px minmax(0,1fr);gap:clamp(6px,.8vw,10px);padding:clamp(3px,.45vw,6px) 0}.bullet.l0{margin-top:clamp(7px,1vw,13px);padding-top:clamp(8px,1vw,13px);border-top:1px solid var(--line);font-size:1.04em;font-weight:700}.bullet.l0:first-child{margin-top:0;padding-top:0;border-top:0}.bullet.l1{padding-left:clamp(14px,2.3vw,32px);color:var(--muted)}.mark{color:var(--gold);font-size:.68em;padding-top:.18em}
    .table{overflow:visible;border:1px solid var(--line);border-radius:12px;background:var(--card)}table{width:100%;min-width:min(620px,100%);border-collapse:collapse;table-layout:auto}th,td{padding:clamp(8px,1.1vw,14px);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:var(--ink);color:var(--paper)}td{color:var(--muted)}td:first-child{color:var(--ink);font-weight:760}tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}
    .cover{display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 72% 35%,rgb(207 164 80/.32),transparent 18rem),linear-gradient(130deg,#152b22,#24352d 58%,#17251f);color:#f6f1e5}.cover h1{margin:0;max-width:950px;font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(2.3rem,5.7vw,6.1rem);font-weight:620;letter-spacing:-.06em;line-height:.98}.cover .sub{margin:clamp(18px,2.6vw,34px) 0 0;max-width:800px;color:#cfd8d2;font-size:clamp(1rem,1.7vw,1.48rem);line-height:1.55}.cover .md{align-self:flex-start;max-width:850px;margin-top:clamp(20px,3vw,42px);padding:.7em 1.1em;border:1px solid rgb(238 213 150/.45);border-radius:14px;color:#efd99e;font-size:clamp(.78rem,1.18vw,1.05rem)}
    .quote{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-left:clamp(42px,9vw,150px)}.qmark{height:.55em;color:var(--gold);font:clamp(5rem,10vw,10rem)/1 Georgia,serif;opacity:.45}.quote h1{margin:0;font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(2.1rem,5vw,5.2rem);font-weight:620;letter-spacing:-.055em;line-height:1.05}.quote .sub{margin:clamp(18px,2.4vw,32px) 0 0;max-width:920px;color:var(--muted);font-size:clamp(.95rem,1.5vw,1.3rem);line-height:1.6}.quote .md{max-width:980px;padding:14px 0 0;color:var(--moss);font-size:clamp(.82rem,1.2vw,1.08rem)}
    .foot{position:absolute;left:clamp(30px,5.2vw,84px);right:clamp(30px,5.2vw,84px);bottom:clamp(17px,2.2vw,30px);display:flex;justify-content:space-between;color:var(--muted);font-size:clamp(.58rem,.8vw,.74rem);font-weight:700}.cover .foot{color:#84928b}
    .dock{position:fixed;z-index:20;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:6px;border:1px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 14px 42px rgb(18 28 24/.18);backdrop-filter:blur(18px)}.dock button{height:38px;padding:0 13px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-weight:700;cursor:pointer}.dock button:hover{background:var(--surface)}.dock button:disabled{opacity:.35;cursor:not-allowed}.divider{width:1px;height:24px;background:var(--line);margin:0 4px}
    dialog{width:min(1160px,calc(100% - 30px));height:min(78svh,740px);padding:0;border:1px solid var(--line);border-radius:22px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}dialog::backdrop{background:rgb(10 18 14/.55);backdrop-filter:blur(4px)}.dlghead{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 28px;border-bottom:1px solid var(--line)}.dlghead h2{margin:0;font-size:1.35rem}.search{display:flex;align-items:center;gap:8px;width:min(360px,45vw);padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}.toc{height:calc(100% - 86px);overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:28px}.toc h3{margin:0 0 8px;color:var(--gold);font-size:.76rem;letter-spacing:.08em}.toc button{width:100%;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:7px 8px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.toc button:hover,.toc button.on{background:var(--gold-soft);color:var(--ink)}.toc b{color:var(--gold);font:700 .7rem ui-monospace,monospace}
    .notes{position:fixed;z-index:18;left:50%;bottom:80px;transform:translateX(-50%);width:min(720px,calc(100% - 30px));padding:15px 19px;border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:0 14px 35px rgb(0 0 0/.14);color:var(--muted);font-size:.92rem}.notes strong{color:var(--gold);margin-right:10px}.hidden{display:none!important}.toast{position:fixed;z-index:30;left:50%;bottom:85px;transform:translateX(-50%);padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:.82rem;font-weight:700}
    @media(max-width:700px){.app{display:flex;flex-direction:column;justify-content:flex-start;padding:14px 10px 82px;overflow-y:auto}.stage{height:auto;min-height:calc(100svh - 110px);aspect-ratio:auto;max-height:none;overflow:visible}.content,.cover,.quote{height:auto;min-height:calc(100svh - 110px);padding:30px 22px 56px}.content{display:block}.heading h1{font-size:clamp(1.7rem,7.6vw,2.25rem)}.full{max-height:none;margin-top:16px;overflow:visible}.md{padding:13px 15px;font-size:.84rem;line-height:1.5}.bullet.l1{padding-left:12px}table{min-width:0;table-layout:fixed}th,td{padding:5px;font-size:.72rem;line-height:1.35;overflow-wrap:anywhere}.cover h1{font-size:clamp(2.3rem,13vw,4rem)}.quote{padding-left:24px}.dock{bottom:10px}.dock button{padding:0 9px}.dock .txt{display:none}.toc{grid-template-columns:1fr}.dlghead{align-items:stretch;flex-direction:column}.search{width:100%}}
    @media print{body{background:#fff}.app{display:block;padding:0;overflow:visible}.top,.dock,.notes,.toast{display:none!important}.stage{width:100%;max-height:none;border:0;border-radius:0;box-shadow:none}.content,.cover,.quote{break-inside:avoid}.full{overflow:hidden}}
  </style>
</head>

  <script>
    const slides=[{"id":1,"part":1,"partTitle":"교육 목표","label":"PART 1. 교육 목표","style":"파트 표지","title":"아동센터 평가 대비 AI 실무교육","subtitle":"기록의 질을 일정하게 만들고, 매달 반복되는 업무를 안전한 흐름으로 바꿉니다.","body":"관찰·상담일지 · 월간 원페이지 소식지 · 달란트 특이사항 누적과 일지 초안 자동화\n\n**AI가 쓰고 사람이 책임지는 기록 체계**"},{"id":2,"part":1,"partTitle":"교육 목표","label":"PART 1. 교육 목표","style":"콘텐츠","title":"오늘 완성할 세 가지 결과물","subtitle":"설명으로 끝내지 않고 내일 바로 복사해 쓰는 기준과 양식을 가져갑니다.","body":"| 결과물 | 오늘 가져갈 것 | 담당자가 할 일 |\n| --- | --- | --- |\n| 기록 | 관찰일지·상담일지 통합 프롬프트 | 사실·누락·표현 검토 후 확정 |\n| 소식지 | 월 1회 입력표와 원페이지 생성 흐름 | 일정·사진 동의·연락처 승인 |\n| 달란트 | 점수표 옆 특이사항 기록·누적 구조 | 점수와 관찰 사실을 분리해 입력 |"},{"id":3,"part":1,"partTitle":"교육 목표","label":"PART 1. 교육 목표","style":"콘텐츠","title":"평가에서 중요한 것은 “많이 쓴 기록”이 아닙니다","subtitle":"날짜별 사실이 서비스 제공과 다음 계획으로 이어지는지를 보여주는 것이 핵심입니다.","body":"1. **구체성** — 언제, 어디서, 어떤 행동과 말이 있었는가?\n2. **연속성** — 하루의 특이사항이 월별 관찰과 상담 기록으로 이어지는가?\n3. **개별성** — 아동의 실제 변화와 필요한 지원이 드러나는가?\n4. **근거성** — 해석이나 낙인이 아니라 확인 가능한 사실인가?\n5. **책임성** — AI 초안을 담당자가 검토하고 확정했는가?"},{"id":4,"part":1,"partTitle":"교육 목표","label":"PART 1. 교육 목표","style":"콘텐츠","title":"제공된 달란트 파일은 이렇게 구성되어 있습니다","subtitle":"원본을 수정하지 않고 구조만 분석했습니다. 현재 파일은 구글 드라이브에서 열리는 Excel 파일입니다.","body":"| 현재 구조 | 확인 내용 | 교육에서의 적용 |\n| --- | --- | --- |\n| 관리 탭 | 아동별 1~12월 합계·총계·월평균 | 월별 요약과 이상값 점검 |\n| 1~12월 탭 | 이름·달란트 칭찬 유형·그룹·날짜별 점수 | 기존 점수 입력 방식 유지 |\n| 아동별 묶음 | 여러 칭찬 항목과 일 합계가 한 묶음 | 점수와 서술 기록을 분리 |\n| 새 특이사항 기록표 | 현재는 별도 누적표가 없음 | 날짜·아동ID·사실·지원·결과를 행 단위로 추가 |"},{"id":5,"part":1,"partTitle":"교육 목표","label":"PART 1. 교육 목표","style":"콘텐츠","title":"자동화 전에 먼저 확인할 데이터 품질","subtitle":"AI가 잘못된 날짜나 수식을 더 빠르게 복제하지 않도록 원본 점검 기준을 정합니다.","body":"* 월별 날짜 머리글이 실제 해당 월인지 확인합니다.\n* 관리 탭의 월별 참조 수식이 같은 아동의 같은 월 합계를 가리키는지 확인합니다.\n* 비정상적으로 큰 양수·음수 점수는 사유와 승인자를 기록합니다.\n* 같은 칭찬 유형의 배점 기준을 센터 안에서 통일합니다.\n* 원본은 백업하고, 구조 변경은 복사본에서 시험합니다.\n\n📌 **잘못된 원본 + 자동화 = 더 빠른 오류**입니다."},{"id":6,"part":1,"partTitle":"교육 목표","label":"PART 1. 교육 목표","style":"콘텐츠","title":"아동 기록에서 AI가 넘지 말아야 할 선","subtitle":"기록은 지원을 위한 근거이지 아동을 분류하는 점수표가 아닙니다.","body":"| AI가 도울 수 있는 일 | 사람이 해야 하는 일 |\n| --- | --- |\n| 입력된 사실 정리, 문장 다듬기, 누락 질문 | 관찰·상담, 위험 판단, 보호자 소통, 최종 서명 |\n| 날짜별 기록 묶기, 반복 표현 줄이기 | 사실 여부와 맥락 확인 |\n| 초안의 개인정보·낙인 표현 찾기 | 기관 규정에 맞는 보관·공개 결정 |\n\n**실명 대신 가명 또는 아동ID**, 공개형 AI에는 최소 정보만 입력, 최종 기록은 사람 승인 후 저장합니다."},{"id":7,"part":2,"partTitle":"관찰·상담일지","label":"PART 2. 관찰·상담일지","style":"콘텐츠","title":"사실과 해석을 분리하면 기록의 질이 일정해집니다","subtitle":"좋은 기록은 판단을 멋지게 쓰는 것이 아니라 관찰 가능한 장면을 남기는 일입니다.","body":"| 구분 | 피해야 할 문장 | 기록할 문장 |\n| --- | --- | --- |\n| 사실 | 집중력이 없다 | 15분 활동 중 세 차례 자리에서 일어났고, 이름을 부른 뒤 자리로 돌아왔다 |\n| 아동의 말 | 활동을 싫어했다 | “문제가 너무 많아서 하기 싫어요”라고 말했다 |\n| 지원 | 잘 지도했다 | 문제 수를 10개에서 5개로 조정하고 5분 뒤 다시 시작하도록 안내했다 |\n| 결과 | 좋아졌다 | 5문제를 마친 뒤 스스로 다음 활동을 선택했다 |"},{"id":8,"part":2,"partTitle":"관찰·상담일지","label":"PART 2. 관찰·상담일지","style":"콘텐츠","title":"일정한 품질을 만드는 입력 카드","subtitle":"AI에게 긴 사연을 주기보다 같은 항목으로 사실을 채우면 결과가 안정됩니다.","body":"기록 종류: 관찰일지 / 상담일지\n아동ID·가명: A-07\n날짜·시간: 2026-11-05 16:10\n장소·상황: 독서 프로그램 시작 전\n관찰 사실: 직접 본 행동과 순서\n아동의 말: 기억나는 말만 그대로\n지원 내용: 담당자가 실제로 한 질문·안내\n변화·결과: 그 뒤 확인된 행동\n추후 계획: 다음에 확인할 일\n\n📌 비어 있는 항목은 AI가 상상하지 않고 **[확인 필요]**로 남깁니다."},{"id":9,"part":2,"partTitle":"관찰·상담일지","label":"PART 2. 관찰·상담일지","style":"실전 프롬프트","title":"하나로 완성한 관찰·상담일지 프롬프트","subtitle":"기록 종류만 선택하면 같은 기준으로 두 일지의 초안을 만들고, 누락과 위험 표현까지 점검합니다.","body":"[역할]\n당신은 지역아동센터·다함께돌봄센터의 기록 업무를 돕는 사회복지 실무 보조자입니다. 입력된 사실만 사용해 관찰일지 또는 상담일지 초안을 작성합니다. 최종 판단과 기록 확정은 담당자가 합니다.\n\n[개인정보 규칙]\n아동은 실명 대신 아동ID 또는 가명을 사용합니다. 연락처, 주소, 학교·학년·보호자 이름, 질병명 등 불필요한 개인정보는 쓰지 않습니다.\n\n[입력]\n기록 종류: [관찰일지 / 상담일지]\n아동ID·가명: [ ]\n날짜·시간: [ ]\n장소·상황: [ ]\n관찰 사실(직접 본 행동·말): [ ]\n아동의 말(기억나는 경우 그대로): [ ]\n담당자의 질문·지원 내용: [ ]\n변화·결과: [ ]\n추후 계획: [ ]\n\n[작성 규칙]\n1. 관찰 사실과 해석을 구분합니다. 성격, 의도, 진단, 가정 배경을 추정하지 않습니다.\n2. 아동의 말은 입력에 있을 때만 따옴표로 옮기고 만들어내지 않습니다.\n3. 행동은 ‘언제·어디서·무엇을·어떻게’가 보이도록 구체적으로 씁니다.\n4. 평가·낙인 표현 대신 중립적인 문장을 사용합니다.\n5. 담당자의 지원 내용과 아동의 반응을 연결합니다.\n6. 정보가 없으면 채우지 말고 [확인 필요]로 표시합니다.\n7. 상담일지는 상담 사유, 주요 내용, 아동의 표현, 지원·합의, 후속 계획을 구분합니다.\n8. 문장은 간결한 공문체로 쓰고, 반복을 줄이되 사실은 빼지 않습니다.\n\n[출력]\nA. 기록 초안: 제목 / 일시 / 상황 / 객관적 사실 / 아동의 표현 / 지원 내용 / 변화·결과 / 추후 계획\nB. 사실과 해석 점검표: 근거 없는 해석, 누락 정보, 개인정보 위험을 표로 표시\nC. 담당자 확인 질문: 확정 전에 확인할 내용만 최대 3개\n\n입력 내용이 상담일지 작성에 부족하면 관찰일지만 작성하고, 상담일지는 [자료 부족]이라고 표시하세요."},{"id":10,"part":2,"partTitle":"관찰·상담일지","label":"PART 2. 관찰·상담일지","style":"콘텐츠","title":"관찰일지는 장면과 지원의 연결을 봅니다","subtitle":"같은 아동을 여러 날 기록할 때는 반복되는 패턴보다 날짜별 변화와 개입 결과를 확인합니다.","body":"| 항목 | 확인 질문 |\n| --- | --- |\n| 상황 | 활동·시간·주변 조건이 적혀 있는가? |\n| 객관적 사실 | 누구나 같은 장면을 떠올릴 수 있는가? |\n| 아동의 표현 | 실제 말과 어른의 해석이 구분되는가? |\n| 지원 | 담당자가 무엇을 했는가? |\n| 결과 | 지원 직후 또는 이후 어떤 변화가 있었는가? |\n| 계획 | 다음 관찰에서 무엇을 확인할 것인가? |"},{"id":11,"part":2,"partTitle":"관찰·상담일지","label":"PART 2. 관찰·상담일지","style":"콘텐츠","title":"상담일지는 대화 내용과 합의를 남깁니다","subtitle":"상담하지 않은 내용을 달란트 점수만으로 상담일지로 만들지 않습니다.","body":"| 필수 항목 | 기록 기준 |\n| --- | --- |\n| 상담 사유 | 어떤 사실 때문에 상담했는가? |\n| 주요 내용 | 질문과 답변의 핵심은 무엇인가? |\n| 아동의 표현 | 직접 말한 내용과 감정 표현 |\n| 지원·합의 | 담당자가 제안하고 함께 정한 내용 |\n| 후속 계획 | 담당자·기한·재확인 시점 |\n\n📌 점수·특이사항은 **상담 준비 자료**가 될 수 있지만, 실제 대화 없이 상담 기록을 만들어서는 안 됩니다."},{"id":12,"part":2,"partTitle":"관찰·상담일지","label":"PART 2. 관찰·상담일지","style":"콘텐츠","title":"AI 초안을 60초 안에 검수하는 여섯 문항","subtitle":"한 문항이라도 아니오이면 수정한 뒤 저장합니다.","body":"* 입력에 없는 사실을 새로 만들지 않았는가?\n* 사실과 해석이 구분되어 있는가?\n* 아동의 말을 임의로 바꾸거나 추가하지 않았는가?\n* 낙인·진단·비난 표현이 없는가?\n* 담당자의 지원과 결과가 연결되어 있는가?\n* 실명·학교·연락처 등 불필요한 개인정보가 빠졌는가?\n\n**검수자·검수일·수정 여부**를 기록하면 AI 사용 과정도 설명할 수 있습니다."},{"id":13,"part":2,"partTitle":"관찰·상담일지","label":"PART 2. 관찰·상담일지","style":"콘텐츠","title":"짧은 메모가 평가 가능한 기록이 되는 과정","subtitle":"AI는 글을 늘리는 도구가 아니라 누락을 묻고 구조를 맞추는 도구로 사용합니다.","body":"| 단계 | 예시 |\n| --- | --- |\n| 현장 메모 | 16:10, 독서 전, “문제가 너무 많아요”, 5개로 줄임, 마침 |\n| 구조화 | 상황·행동·아동의 말·지원·결과로 나눔 |\n| AI 초안 | 중립적 문장과 누락 항목 표시 |\n| 담당자 검수 | 실제 사실·용어·추후 계획 수정 |\n| 확정 기록 | 승인자와 날짜를 남겨 기관 서식에 저장 |"},{"id":14,"part":3,"partTitle":"월간 원페이지 소식지","label":"PART 3. 월간 원페이지 소식지","style":"콘텐츠","title":"소식지는 매월 새로 쓰지 않고 자료를 모읍니다","subtitle":"한 달 동안 입력표를 채우면 마지막 주에 한 번에 원페이지를 만듭니다.","body":"1. **매 활동 직후** — 날짜, 활동명, 목표, 익명 반응, 사진 동의를 2분 안에 기록\n2. **매월 20일** — 다음 달 일정과 보호자 안내 취합\n3. **매월 25일** — AI로 원페이지 초안 생성\n4. **매월 26~27일** — 담당자와 시설장이 사실·사진·일정 검수\n5. **월말** — PDF·이미지·웹페이지 중 센터 방식으로 전달\n\n📌 소식지를 잘 만드는 핵심은 글쓰기보다 **매일의 짧은 원자료**입니다."},{"id":15,"part":3,"partTitle":"월간 원페이지 소식지","label":"PART 3. 월간 원페이지 소식지","style":"콘텐츠","title":"소식지 원자료는 한 줄씩 쌓습니다","subtitle":"구글폼이나 구글시트 한 탭으로 직원 누구나 같은 항목을 입력하게 합니다.","body":"| 날짜 | 활동명 | 목표 | 한 일 | 아동 반응(익명) | 사진 동의 | 다음 안내 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 11/3 | 독서모임 | 자기표현 | 그림책 질문 나눔 | “다음 장도 읽고 싶어요” | 확인 | 11/10 준비물 |\n\n**사진 사용 동의**는 확인 / 미확인 / 사용 안 함으로 구분합니다. 미확인은 자동으로 제외합니다."},{"id":16,"part":3,"partTitle":"월간 원페이지 소식지","label":"PART 3. 월간 원페이지 소식지","style":"실전 프롬프트","title":"복사해서 쓰는 월간 소식지 프롬프트","subtitle":"입력표를 붙여 넣으면 A4 한 장 구조로 정리하고, 없는 사실은 확인 필요로 남깁니다.","body":"[역할] 보호자에게 보내는 지역아동센터 월간 소식지 편집자입니다.\n[입력] 센터명, 발행월, 이번 달 활동, 활동 목표, 아동 반응(익명), 다음 달 일정, 준비물·안내, 사진 사용 동의 여부.\n[규칙] 제공된 사실만 사용하고 아동 개인을 식별할 내용은 빼세요. 사진 사용 동의가 확인되지 않은 사진은 넣지 마세요. 과장·평가·낙인을 피하고 따뜻하고 쉬운 문장으로 쓰세요.\n[출력] A4 한 장 분량으로 ① 이번 달 한눈에 보기 ② 활동 2~4개와 배운 점 ③ 익명 아동 반응 ④ 다음 달 일정 ⑤ 보호자 안내 ⑥ 연락처 순서로 작성하세요. 긴 문장은 줄이고 날짜·시간·준비물은 표로 정리하세요. 사실이 없으면 [확인 필요]라고 표시하세요."},{"id":17,"part":3,"partTitle":"월간 원페이지 소식지","label":"PART 3. 월간 원페이지 소식지","style":"콘텐츠","title":"원페이지는 여섯 칸이면 충분합니다","subtitle":"보호자가 휴대전화에서 한 번에 읽도록 짧은 제목·표·연락처를 사용합니다.","body":"| 영역 | 내용 | 분량 기준 |\n| --- | --- | --- |\n| 머리말 | 발행월·센터명·한 줄 인사 | 2문장 |\n| 이번 달 | 핵심 활동 2~4개 | 활동당 2~3문장 |\n| 배운 점 | 목표와 익명 반응 | 3~5줄 |\n| 다음 달 | 날짜·시간·준비물 | 표 1개 |\n| 보호자 안내 | 꼭 확인할 사항 | 3개 이내 |\n| 연락처 | 문의 방법·담당 시간 | 1줄 |"},{"id":18,"part":3,"partTitle":"월간 원페이지 소식지","label":"PART 3. 월간 원페이지 소식지","style":"콘텐츠","title":"가장 간편한 시스템: 입력 2분, 생성 10분, 검수 10분","subtitle":"처음에는 자동 발송보다 반복 가능한 반자동 흐름이 안전합니다.","body":"| 도구 | 역할 |\n| --- | --- |\n| Google Form | 직원이 휴대전화로 활동 기록 입력 |\n| Google Sheet | 월별 원자료 자동 누적·필터 |\n| 생성형 AI | 선택한 월의 자료로 소식지 초안 |\n| 문서·Canva·HTML | 한 장 레이아웃 |\n| 사람 승인 | 일정·사진 동의·표현·연락처 확인 |\n\n외부 발송은 마지막 단계에서 **사람 승인** 후 진행합니다."},{"id":19,"part":4,"partTitle":"달란트와 특이사항","label":"PART 4. 달란트와 특이사항","style":"콘텐츠","title":"기존 점수표는 유지하고 기록 로그를 옆에 붙입니다","subtitle":"월별 넓은 표에 긴 문장을 직접 넣으면 검색·집계·자동화가 어려워집니다.","body":"| 탭 | 역할 | 입력 방식 |\n| --- | --- | --- |\n| 관리 | 월 합계·총계·평균 | 기존 수식 유지 |\n| 1~12월 | 날짜별 달란트 점수 | 기존 방식 유지 |\n| 특이사항 기록 | 날짜별 한 사건을 한 행에 기록 | Google Form 또는 입력 행 |\n| 월별 요약 | 아동ID·월·범주로 기록 조회 | FILTER·QUERY·피벗 |\n\n**점수표와 서술 기록을 분리하되 날짜와 아동ID로 연결**합니다."},{"id":20,"part":4,"partTitle":"달란트와 특이사항","label":"PART 4. 달란트와 특이사항","style":"콘텐츠","title":"특이사항 기록표의 권장 열","subtitle":"한 행에 한 아동의 한 사건만 기록해야 이후 일지 초안이 정확해집니다.","body":"| 열 | 입력 내용 |\n| --- | --- |\n| 기록시각·관찰일 | 자동시각과 실제 날짜 |\n| 아동ID·월 | 가명 ID와 월 |\n| 점수 위치 | 월 탭·칭찬 유형·해당 날짜 |\n| 범주 | 출결·관계·학습·생활·안전·상담 준비 |\n| 관찰 사실 | 직접 본 행동·말 |\n| 지원 내용 | 직원이 실제로 한 일 |\n| 변화·결과 | 확인된 반응 |\n| 후속 확인일·기록자 | 다음 확인과 책임 |"},{"id":21,"part":4,"partTitle":"달란트와 특이사항","label":"PART 4. 달란트와 특이사항","style":"콘텐츠","title":"칸을 클릭해 기록하는 가장 쉬운 방법","subtitle":"엑셀 파일을 구글시트로 변환하지 않아도 링크 방식으로 먼저 시작할 수 있습니다.","body":"1. 특이사항 기록용 **Google Form**을 만듭니다.\n2. 월별 점수표 상단이나 고정 열에 **“특이사항 기록” 링크**를 둡니다.\n3. 직원은 점수를 입력한 뒤 링크를 눌러 날짜·아동ID·사실·지원을 기록합니다.\n4. 응답은 특이사항 기록표에 한 행씩 자동 누적됩니다.\n5. 월말에 아동ID와 기간으로 필터해 AI 초안에 넣습니다.\n\n📌 모바일에서는 이 방식이 체크박스 팝업보다 단순하고 안정적입니다."},{"id":22,"part":4,"partTitle":"달란트와 특이사항","label":"PART 4. 달란트와 특이사항","style":"콘텐츠","title":"체크박스 방식은 2단계로 구현합니다","subtitle":"직원이 꼭 같은 점수 칸에서 시작해야 한다면 복사본에서 먼저 시험합니다.","body":"| 단계 | 구현 | 주의 |\n| --- | --- | --- |\n| 1단계 | 날짜별 점수 옆에 체크박스 또는 “기록 있음” 열 | 체크만 하고 서술을 빼먹지 않도록 링크 표시 |\n| 2단계 | Apps Script가 체크된 행의 날짜·아동ID를 폼에 미리 채움 | 모바일·권한·다중 사용자 테스트 필요 |\n\n체크박스는 **특이사항이 있다는 표시**, 실제 내용은 별도 기록표에 저장합니다. 팝업 자동 실행은 기기마다 다를 수 있어 교육에서는 Google Form 연결을 우선 권장합니다."},{"id":23,"part":4,"partTitle":"달란트와 특이사항","label":"PART 4. 달란트와 특이사항","style":"콘텐츠","title":"월별·아동별 기록을 자동으로 모으는 식","subtitle":"특이사항 기록표가 행 단위로 쌓이면 고정 범위 대신 늘어나는 전체 열을 참조합니다.","body":"**예시 열**: A 관찰일, B 아동ID, C 범주, D 관찰 사실, E 지원, F 결과\n\n아동ID 선택셀 H2, 시작일 H3, 종료일 H4인 경우:\n`=FILTER(특이사항기록!A:F, 특이사항기록!B:B=H2, 특이사항기록!A:A>=H3, 특이사항기록!A:A<=H4)`\n\n월별 건수:\n`=COUNTIFS(특이사항기록!B:B,H2,특이사항기록!A:A,\">=\"&H3,특이사항기록!A:A,\"<=\"&H4)`\n\n📌 실제 탭 이름과 열 위치에 맞춰 복사본에서 조정합니다."},{"id":24,"part":4,"partTitle":"달란트와 특이사항","label":"PART 4. 달란트와 특이사항","style":"실전 프롬프트","title":"누적 기록을 일지 초안으로 바꾸는 프롬프트","subtitle":"선택한 아동ID와 기간의 기록만 넣고, 사건별 날짜와 근거를 유지합니다.","body":"[입력] 아래는 [아동ID]의 [시작일]~[종료일] 특이사항 기록입니다.\n[임무] 날짜별 사실을 빠짐없이 정리하고, 반복되는 상황과 지원 뒤의 변화를 근거가 있는 범위에서만 묶어 관찰일지 초안을 작성하세요. 실제 상담 기록이 포함된 경우에만 상담일지 초안을 별도로 작성하세요.\n[규칙] 점수의 높고 낮음만으로 성격·의도·문제를 판단하지 마세요. 서로 다른 날짜의 사건을 하나처럼 합치지 마세요. 사실과 해석을 구분하고, 정보가 없으면 [확인 필요]로 표시하세요.\n[출력] 날짜별 근거표 → 관찰일지 초안 → 상담일지 작성 가능 여부 → 후속 확인 질문 → 개인정보·낙인 점검."},{"id":25,"part":5,"partTitle":"내일 실습","label":"PART 5. 내일 실습","style":"콘텐츠","title":"90분 교육 운영안","subtitle":"실습자는 프롬프트와 시스템 흐름을 직접 한 번 완성합니다.","body":"| 시간 | 내용 | 결과 |\n| --- | --- | --- |\n| 0~10분 | 평가 기록의 원칙과 개인정보 | 입력 금지 목록 |\n| 10~35분 | 짧은 메모로 관찰·상담일지 프롬프트 실습 | 검수된 기록 초안 |\n| 35~55분 | 월간 소식지 입력표와 원페이지 생성 | 다음 달 소식지 틀 |\n| 55~80분 | 달란트 파일 구조와 특이사항 기록 흐름 | 센터용 열 설계 |\n| 80~90분 | 체크리스트·담당자·다음 행동 확정 | 1주 실행 계획 |"},{"id":26,"part":5,"partTitle":"내일 실습","label":"PART 5. 내일 실습","style":"마무리 슬로건","title":"기록은 AI가 대신 책임지는 일이 아닙니다","subtitle":"AI는 흩어진 사실을 정리하고 누락을 묻습니다. 아동을 보고 판단하고 책임지는 사람은 종사자입니다.","body":"1주 안에 할 일\n* 원본 달란트 파일 백업과 수식·날짜 점검\n* 가명 아동ID 목록과 접근 권한 확정\n* 특이사항 Google Form과 기록표 복사본 만들기\n* 관찰일지 프롬프트를 가상 사례로 시험\n* 소식지 입력표를 직원 1명이 일주일 사용\n* 시설장 검수 후 정식 운영 여부 결정\n\n**날짜별 사실 → 지원 → 변화 → 다음 계획**이 이어지면 평가를 위한 기록과 좋은 돌봄이 함께 좋아집니다."}]; let current=0;
    const $=id=>document.getElementById(id); const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    function markdown(text,compact=false){const lines=text.split('\n'),out=[];for(let i=0;i<lines.length;){const line=lines[i];if(!line.trim()){i++;continue}if(line.trim().startsWith('|')){const t=[];while(i<lines.length&&lines[i].trim().startsWith('|'))t.push(lines[i++]);const rows=t.map(r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));out.push('<div class="table"><table><thead><tr>'+rows[0].map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(2).map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue}const b=line.match(/^(\s*)\*\s+(.*)$/);if(b){const level=Math.min(1,Math.floor(b[1].length/2));out.push('<div class="bullet l'+level+'"><span class="mark">'+(level?'•':'◆')+'</span><div>'+inline(b[2])+'</div></div>');i++;continue}out.push('<p>'+inline(line)+'</p>');i++}return '<div class="md'+(compact?' compact':'')+'">'+out.join('')+'</div>'}
    const cover=s=>s.style.includes('표지')||s.style.includes('메인 타이틀'); const quote=s=>s.style.includes('슬로건')||s.style.includes('Quote');
    function fitSlide(){
      const stage=$('stage'),section=stage.querySelector('.content'),full=stage.querySelector('.full');
      if(!section||!full||innerWidth<=700)return;
      section.classList.remove('ultra-fit');full.style.overflow='hidden';
      const title=section.querySelector('.heading h1'),sub=section.querySelector('.heading>p:last-child'),md=full.querySelector('.md'),cells=[...full.querySelectorAll('th,td')];
      const targets=[title,sub,md,...cells].filter(Boolean);targets.forEach(el=>el.removeAttribute('style'));
      ['paddingTop','paddingRight','paddingBottom','paddingLeft'].forEach(key=>section.style[key]='');
      const base=targets.map(el=>({el,size:parseFloat(getComputedStyle(el).fontSize)}));
      const pad={top:parseFloat(getComputedStyle(section).paddingTop),right:parseFloat(getComputedStyle(section).paddingRight),bottom:parseFloat(getComputedStyle(section).paddingBottom),left:parseFloat(getComputedStyle(section).paddingLeft)};
      const overflow=()=>full.scrollHeight>full.clientHeight+2||stage.scrollHeight>stage.clientHeight+2;
      let scale=1;
      const apply=()=>{base.forEach(({el,size})=>{const floor=el===title?22:el===sub?11.5:el===md?10.5:9;el.style.fontSize=Math.max(floor,size*scale)+'px'});cells.forEach(el=>el.style.padding=Math.max(3,12*scale)+'px');section.style.paddingTop=Math.max(13,pad.top*scale)+'px';section.style.paddingBottom=Math.max(27,pad.bottom*scale)+'px';section.style.paddingLeft=Math.max(20,pad.left*scale)+'px';section.style.paddingRight=Math.max(20,pad.right*scale)+'px'};
      while(overflow()&&scale>.62){scale-=.04;apply()}
      if(overflow()){section.classList.add('ultra-fit');while(overflow()&&scale>.42){scale-=.03;apply()}}
      if(overflow())full.style.overflow='auto';
    }
    function render(){const s=slides[current];$('part').textContent='PART '+s.part+' · '+s.partTitle;$('topTitle').textContent=s.title;$('count').textContent=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('noteText').textContent=s.style+' · '+s.subtitle;let body='';if(cover(s)){body='<section class="cover"><p class="eyebrow">PART '+s.part+' · '+esc(s.partTitle)+'</p><h1>'+inline(s.title)+'</h1><p class="sub">'+inline(s.subtitle)+'</p>'+markdown(s.body,true)+'<footer class="foot"><span>아동센터 평가 대비 AI 실무교육</span><span>'+String(s.id).padStart(2,'0')+'</span></footer></section>'}else if(quote(s)){body='<section class="quote"><p class="eyebrow">'+inline(s.label)+'</p><span class="qmark">“</span><h1>'+inline(s.title)+'</h1><p class="sub">'+inline(s.subtitle)+'</p>'+markdown(s.body,true)+'<footer class="foot"><span>아동센터 평가 대비 AI 실무교육</span><span>'+String(s.id).padStart(2,'0')+'</span></footer></section>'}else{const copy=s.style.includes('프롬프트')?'<button onclick="copySlide()" style="float:right;border:0;border-radius:8px;padding:8px 12px;background:var(--gold-soft);color:var(--ink);font-weight:750;cursor:pointer">프롬프트 복사</button>':'';body='<section class="content"><header class="heading"><p class="eyebrow">'+inline(s.label)+'</p>'+copy+'<h1>'+inline(s.title)+'</h1><p>'+inline(s.subtitle)+'</p></header><div class="full">'+markdown(s.body)+'</div><footer class="foot"><span>아동센터 평가 대비 AI 실무교육</span><span>'+String(s.id).padStart(2,'0')+'</span></footer></section>'}$('stage').innerHTML=body;history.replaceState(null,'','#slide-'+(current+1));renderToc($('search').value);requestAnimationFrame(()=>requestAnimationFrame(fitSlide))}
    function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()} function copySlide(){const s=slides[current];navigator.clipboard.writeText(s.title+'\n'+s.subtitle+'\n\n'+s.body);$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1500)}
    function renderToc(q=''){const term=q.trim().toLowerCase(),groups=[];for(let p=1;p<=9;p++){const list=slides.filter(s=>s.part===p&&(!term||(s.title+' '+s.subtitle+' '+s.label+' '+s.body).toLowerCase().includes(term)));if(!list.length)continue;groups.push('<section><h3>PART '+p+' · '+esc(list[0].partTitle)+'</h3>'+list.map(s=>'<button class="'+(s.id===current+1?'on':'')+'" onclick="go('+(s.id-1)+');tocDialog.close()"><b>'+String(s.id).padStart(2,'0')+'</b><span>'+inline(s.title)+'</span></button>').join('')+'</section>')}$('toc').innerHTML=groups.join('')}
    $('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('tocBtn').onclick=()=>{$('tocDialog').showModal();renderToc($('search').value)};$('search').oninput=e=>renderToc(e.target.value);$('noteBtn').onclick=()=>$('notes').classList.toggle('hidden');$('theme').onclick=()=>document.documentElement.classList.toggle('dark');$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key.toLowerCase()==='o')$('tocBtn').click();else if(e.key.toLowerCase()==='n')$('noteBtn').click()});let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,100)});addEventListener('beforeprint',fitSlide);
    const hash=location.hash.match(/slide-(\d+)/);if(hash)current=Math.max(0,Math.min(slides.length-1,Number(hash[1])-1));render();if(document.fonts)document.fonts.ready.then(fitSlide);
  </script>
</body>
</html>
