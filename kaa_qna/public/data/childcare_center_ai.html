    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}button,input{font:inherit}

    .top{width:min(1280px,100%);margin:auto;display:flex;align-items:end;justify-content:space-between;gap:20px}.top p{margin:0 0 4px;color:var(--gold);font-size:.75rem;font-weight:850;letter-spacing:.12em}.top span{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top strong{font:800 .9rem ui-monospace,monospace;white-space:nowrap}.top i{color:var(--line);font-style:normal}

    .content,.cover,.quote{height:100%;padding:clamp(28px,4.4vw,70px) clamp(30px,5.2vw,84px) clamp(54px,6vw,86px);position:relative}.content{display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,1.8vw,24px)}.content.ultra-fit{gap:6px}.content.ultra-fit .eyebrow{margin-bottom:5px}.content.ultra-fit .heading>p:last-child{margin-top:5px;line-height:1.3}.content.ultra-fit .md{line-height:1.34}.content.ultra-fit th,.content.ultra-fit td{line-height:1.22}.content.ultra-fit .bullet{padding-top:2px;padding-bottom:2px}.eyebrow{margin:0 0 clamp(10px,1.4vw,20px);color:var(--gold);font-size:clamp(.65rem,1vw,.92rem);font-weight:850;letter-spacing:.12em;text-transform:uppercase}

    @media print{body{background:#fff}.app{display:block;padding:0;overflow:visible}.top,.dock,.notes,.toast{display:none!important}.stage{width:100%;max-height:none;border:0;border-radius:0;box-shadow:none}.content,.cover,.quote{break-inside:avoid}.full{overflow:hidden}}

  <script>
    const slides=[{"id":1,"part":1,"partTitle":"마인드셋 (Mindset)","label":"PART 1. 마인드셋 (Mindset)","style":"파트 표지","title":"AI, 두려움을 넘어 돌봄 현장으로","subtitle":"반복 업무를 줄이고 아동과 만나는 시간에 집중하는 아주 쉬운 AI 첫걸음","body":"💡 “AI는 부지런한 손, 돌봄 종사자는 따뜻한 눈과 책임”\n\n지역아동센터·다함께돌봄센터 종사자를 위한 맞춤형 실전 AI 가이드"},{"id":2,"part":1,"partTitle":"마인드셋 (Mindset)","label":"PART 1. 마인드셋 (Mindset) · 1/2","style":"콘텐츠","title":"우리는 AI라는 말만 들어도 손사래 친다 ①","subtitle":"낯선 기술 앞에서 느끼는 솔직한 마음과 두려움의 진짜 이유","body":"😨 손사래 치는 이유 (솔직한 고백)\n* \"나는 기계치라 컴퓨터 다루는 게 겁난다\"\n* \"AI라는 말만 들어도 무섭고 부담스럽다\"\n* \"복잡한 영어와 낯선 IT 용어들이 너무 어렵다\"\n* \"잘못 눌러서 망가질까 봐 걱정된다\""},{"id":3,"part":1,"partTitle":"마인드셋 (Mindset)","label":"PART 1. 마인드셋 (Mindset) · 2/2","style":"콘텐츠","title":"우리는 AI라는 말만 들어도 손사래 친다 ②","subtitle":"낯선 기술 앞에서 느끼는 솔직한 마음과 두려움의 진짜 이유","body":"💡 두려움 뒤에 숨겨진 진실\n* 막연한 두려움 👉 누구나 겪는 지극히 정상적인 반응입니다!\n* 낯선 용어들 👉 아직 익숙하지 않을 뿐, 원리는 아주 단순합니다.\n* 실패에 대한 걱정 👉 어차피 처음엔 못하는 게 당연합니다. 편하게 눌러보세요!"},{"id":4,"part":1,"partTitle":"마인드셋 (Mindset)","label":"PART 1. 마인드셋 (Mindset)","style":"콘텐츠","title":"AI는 돌봄 업무의 '세탁기'입니다","subtitle":"반복 정리와 문서 작업을 덜어 아동을 직접 만나는 시간을 되찾습니다.","body":"🧺 세탁기가 준 교훈\n* 손으로 반복하던 일을 기계가 맡아 사람에게 시간을 돌려주었습니다.\n* AI도 신청 자료 정리, 회의록 초안, 안내문 초안 같은 반복 업무를 도울 수 있습니다.\n* 절약한 시간은 아동 관찰, 관계 형성, 보호자 소통과 안전 확인에 사용합니다.\n\n📌 AI가 돌봄을 대신하는 것이 아니라 **돌봄에 집중할 시간을 돕는 도구**입니다."},{"id":5,"part":1,"partTitle":"마인드셋 (Mindset)","label":"PART 1. 마인드셋 (Mindset) · 1/2","style":"콘텐츠","title":"자고 일어나면 바뀌는 메뉴, '기능'이 아닌 '개념과 맥락'의 힘 ①","subtitle":"어디를 누르는지 외우지 마세요. 글의 맥락을 읽듯 AI의 원리를 이해해야 합니다.","body":"⚡ 매일 겪는 급변과 혼란 (UI의 변화)\n* 자고 일어나면 새로운 모델 등장, 메뉴 위치가 바뀜\n* 어제 그림을 안 그려주던 앱이 오늘은 그림을 그려줌\n* 강사가 '여기 보세요' 했는데 버튼이 없거나, 순차 배포(A/B 롤아웃)로 강사와 학생의 화면이 다른 경우 속출"},{"id":6,"part":1,"partTitle":"마인드셋 (Mindset)","label":"PART 1. 마인드셋 (Mindset) · 2/2","style":"콘텐츠","title":"자고 일어나면 바뀌는 메뉴, '기능'이 아닌 '개념과 맥락'의 힘 ②","subtitle":"어디를 누르는지 외우지 마세요. 글의 맥락을 읽듯 AI의 원리를 이해해야 합니다.","body":"💡 우리가 잡아야 할 본질 (개념과 맥락)\n* 단순 버튼 위치나 작업 하나만 외우면 다음 날 UI가 바뀌면 아무것도 못 하게 됩니다.\n* 글의 맥락을 이해하듯 \"아! AI에게 이런 방식으로 일을 시킬 수 있구나!\"라는 원리를 이해해야 합니다.\n* 개념을 잡으면 어떤 새로운 화면이 나와도 스스로 응용할 수 있습니다."},{"id":7,"part":1,"partTitle":"마인드셋 (Mindset)","label":"PART 1. 마인드셋 (Mindset)","style":"콘텐츠","title":"AI 광고의 환상 vs 현실: 딸깍보다 중요한 총비용","subtitle":"빠른 시제품은 가능하지만, 좋은 결과에는 자료 준비·검수·수정·운영 시간이 함께 듭니다.","body":"| 광고에서 자주 보이는 말 | 실제로 확인할 것 |\n| --- | --- |\n| 한 번 클릭하면 완성 | 목표·자료·제약·검수 기준이 준비되었는가? |\n| 무료로 모두 해결 | 구독·API·저장·호스팅·검수 시간은 얼마인가? |\n| 자동으로 알아서 실행 | 어떤 도구와 권한을 주었고, 어디서 사람이 승인하는가? |\n\n📌 AI 비용은 구독료만이 아닙니다. **성공한 업무 1건을 완성하는 데 든 전체 비용과 시간**으로 비교하십시오."},{"id":8,"part":1,"partTitle":"마인드셋 (Mindset)","label":"PART 1. 마인드셋 (Mindset)","style":"콘텐츠","title":"자전거를 책으로 배우는 사람은 없습니다","subtitle":"복잡한 이론을 공부하려 하지 말고, 오늘 직접 페달을 밟아보세요.","body":"🚴 실천이 최고의 공부입니다\n* 원리를 몰라도 탈 수 있습니다:\n스마트폰 터치만 할 줄 알면 AI 사용 준비 완료!\n* 넘어지면서 균형을 잡습니다:\n엉뚱한 답변이 나와도 괜찮습니다. 질문을 던지는 경험 자체가 실력입니다.\n* 지금 바로 페달을 밟으십시오:\n책 10권 읽는 것보다 챗GPT에 3번 질문하는 것이 훨씬 빠릅니다."},{"id":9,"part":1,"partTitle":"마인드셋 (Mindset)","label":"PART 1. 마인드셋 (Mindset)","style":"콘텐츠","title":"AI의 무눈치와 돌봄 종사자의 책임","subtitle":"AI는 아동의 맥락과 감정을 완전히 알지 못합니다. 입력·검토·사용의 책임은 사람에게 있습니다.","body":"* AI는 그럴듯한 답을 만들 수 있지만 사실·관계·아동안전의 책임을 지지 않습니다.\n* 이름·연락처·가족관계·건강·상담·학교·생활기록은 공개형 AI에 원문 그대로 넣지 않습니다.\n* 자동 낙인, 위험 점수, 가정환경 추정에 AI를 사용하지 않습니다.\n* 외부 발송·공개 게시·기록 수정·삭제는 반드시 담당자 승인을 거칩니다.\n\n📌 먼저 물으십시오. **“이 자료를 넣어도 되는가? 이 행동을 AI가 해도 되는가?”**"},{"id":10,"part":1,"partTitle":"AI 진화 4단계","label":"AI의 여러 활용 방식","style":"콘텐츠","title":"AI는 한 줄로 진화하지 않고, 서로 다른 환경에서 일합니다","subtitle":"분류·예측, 생성, 디지털 실행, 물리적 실행은 앞뒤 단계가 아니라 목적과 환경이 다른 활용 방식입니다.","body":"| 활용 방식 | 하는 일 | 센터 운영·지역 돌봄 사례 |\n| --- | --- | --- |\n| 인지·예측 AI | 분류하고 패턴과 가능성을 찾음 | 설문 분류, 반복 문의 유형 파악 |\n| 생성형 AI | 글·이미지·음성·코드 초안을 만듦 | 프로그램 요약, 교육 자료, 홍보 문안 |\n| 디지털 에이전트 | 도구를 연결해 여러 단계의 디지털 업무를 수행 | 회의록→할 일→일정·메일 초안 |\n| 피지컬 AI | 센서와 기계를 통해 현실 공간에서 행동 | 안내 로봇, 번역 기기, 재난 지원 장비 |\n\n📌 모델이 좋아졌다고 자동으로 에이전트가 되는 것은 아닙니다. **목표·지침·도구·권한·승인·기록**이 함께 설계되어야 합니다."},{"id":11,"part":1,"partTitle":"AI 진화 4단계","label":"PART 1. AI 진화 4단계","style":"콘텐츠","title":"인지·예측 AI와 생성형 AI: 찾는 일과 만드는 일","subtitle":"하나는 데이터에서 패턴을 찾고, 다른 하나는 배운 패턴을 바탕으로 새로운 초안을 만듭니다.","body":"인지·예측 AI — “무엇인지 찾고 분류하기”\n* 핵심: 사진·글·수치에서 대상과 패턴을 찾습니다.\n* 센터 사례: 공개 설문 분류, 문서 OCR, 반복 문의 유형 파악\n* 주의: 아동의 성격·위험·가정환경을 자동 추정하거나 점수화하지 않습니다.\n\n생성형 AI — “새로운 초안 만들기”\n* 핵심: 학습된 패턴을 바탕으로 글·그림·음성·코드 초안을 만듭니다.\n* 센터 사례: 프로그램 안내문, 공개용 포스터 문구, 활동 질문, 웹페이지 코드 초안\n* 주의: 사실·사진 동의·공개 범위·연령 적합성을 사람이 검토합니다."},{"id":12,"part":1,"partTitle":"AI 진화 4단계","label":"PART 1. AI 진화 4단계","style":"콘텐츠","title":"디지털 에이전트와 피지컬 AI: 행동하는 환경이 다릅니다","subtitle":"에이전트는 문서·브라우저·업무 앱에서, 피지컬 AI는 센서·로봇·기계를 통해 현실에서 행동합니다.","body":"디지털 에이전트 — 업무 화면에서 실행\n* 핵심: 목표를 작은 단계로 나누고 허용된 앱과 파일을 사용합니다.\n* 센터 사례: 공개 일정 자료→안내문·일정표 초안, 회의 메모→담당·기한 정리\n* 사람 승인: 외부 발송·일정 등록·기록 수정·삭제 전 확인\n\n피지컬 AI — 현실 공간에서 실행\n* 핵심: AI가 센서·스피커·로봇·기계와 결합해 물리적 행동을 합니다.\n* 센터 사례: 내부 하원 음성 알림, 공기질·온도 감지, 시설 청소 보조\n* 사람 책임: 아동 인계·귀가 안전·위기 판단은 종사자가 직접 확인"},{"id":13,"part":1,"partTitle":"마인드셋 (Mindset)","label":"AI 작업 방식 지도","style":"파트 표지","title":"생성형 AI에서 실행형 에이전트로","subtitle":"먼저 ‘내용을 만드는 AI’와 ‘도구를 사용해 일을 수행하는 AI’로 나누고, 업무용과 코딩용으로 더 자세히 살펴봅니다.","body":"제품 이름보다 **목표·도구·권한·작업 환경·승인 지점**을 봅니다."},{"part":1,"partTitle":"AI 작업 방식 지도","label":"먼저 두 가지로 구분하기 · 1/2","style":"콘텐츠","title":"내용을 만드는 AI, 일을 수행하는 AI ①","subtitle":"초보자에게는 ‘생성형 AI 중심 사용’과 ‘AI 에이전트 중심 사용’으로 먼저 나누면 쉽습니다.","body":"| 구분 | 생성형 AI 중심 사용 | AI 에이전트 중심 사용 |\n| --- | --- | --- |\n| **핵심 역할** | 질문과 자료를 바탕으로 답변·초안·새로운 내용을 만듦 | 목표를 받아 허용된 도구로 여러 단계를 이어서 수행함 |\n| **주요 작업** | 글쓰기, 요약, 번역, 아이디어, 이미지 생성 | 자료 조사, 파일 정리, 문서·표·웹페이지 제작, 연결 앱 작업 |","id":14},{"part":1,"partTitle":"AI 작업 방식 지도","label":"먼저 두 가지로 구분하기 · 2/2","style":"콘텐츠","title":"내용을 만드는 AI, 일을 수행하는 AI ②","subtitle":"초보자에게는 ‘생성형 AI 중심 사용’과 ‘AI 에이전트 중심 사용’으로 먼저 나누면 쉽습니다.","body":"| 구분 | 생성형 AI 중심 사용 | AI 에이전트 중심 사용 |\n| --- | --- | --- |\n| **요청 예시** | “방학 프로그램 안내문을 작성해 줘.” | “이 공개 자료로 일정표와 안내 웹페이지를 만들고 링크를 확인해 줘.” |\n| **쉬운 비유** | 함께 생각하고 초안을 써 주는 조언자 | 도구를 사용해 결과물을 만드는 업무 보조자 |\n\n📌 에이전트도 개인정보 처리·전송·게시 전에는 사람 승인을 받아야 합니다.","id":15},{"part":1,"partTitle":"AI 작업 방식 지도","label":"둘의 관계","style":"콘텐츠","title":"생성형 AI와 에이전트는 끊어진 기술이 아닙니다","subtitle":"생성형 AI가 도구를 사용하며 계획→실행→확인을 이어가도록 확장될수록 에이전트형 사용에 가까워집니다.","body":"| 대화와 생성 | 도구 사용 | 다단계 실행 | 결과 확인·재시도 |\n| --- | --- | --- | --- |\n| 답변과 초안을 만듦 | 검색·파일·앱·터미널을 사용 | 목표를 작은 단계로 나눠 수행 | 결과를 비교하고 수정하거나 승인을 요청 |\n\n**쉽게 말하면**\n\n* 생성형 AI = 생각하고 표현하는 능력\n* AI 에이전트 = 그 능력에 목표·도구·권한·실행 루프를 붙인 시스템\n\n※ 모델이 좋아졌다고 자동으로 에이전트가 되는 것은 아닙니다. 어떤 도구와 권한을 어떻게 연결했는지가 중요합니다.","id":16},{"part":1,"partTitle":"AI 작업 방식 지도","label":"세 가지 중심 사용 · 1/2","style":"콘텐츠","title":"생성형 AI · 일반 업무용 에이전트 · 코딩용 에이전트 ①","subtitle":"모두 AI이지만 주로 일하는 환경과 검토 방법이 다릅니다.","body":"| 구분 | 생성형 AI 중심 | 일반 업무용 에이전트 | 개발·코딩용 에이전트 |\n| --- | --- | --- | --- |\n| **쉬운 설명** | 함께 생각하고 내용을 만드는 AI | 업무 도구로 결과물을 완성하는 AI | 개발 도구로 코드를 수정·검증하는 AI |\n| **작업 환경** | 대화창, 첨부 자료, 검색 | 문서, 파일, 이메일, 일정, 브라우저, 연결 앱 | 저장소, 편집기, 터미널, 테스트, Git, 브라우저 |","id":17},{"part":1,"partTitle":"AI 작업 방식 지도","label":"세 가지 중심 사용 · 2/2","style":"콘텐츠","title":"생성형 AI · 일반 업무용 에이전트 · 코딩용 에이전트 ②","subtitle":"모두 AI이지만 주로 일하는 환경과 검토 방법이 다릅니다.","body":"| 구분 | 생성형 AI 중심 | 일반 업무용 에이전트 | 개발·코딩용 에이전트 |\n| --- | --- | --- | --- |\n| **센터 결과** | 프로그램 초안, 보호자 안내문, 블로그 글 | 신청 자료 정리, 회의록, 일정표, 소식지 | 신청·안내 웹페이지, 홈페이지, 자동화 도구 |\n| **사람 승인** | 사실·표현·공개 범위 | 전송·일정·개인정보·삭제 | 보안·데이터 영향·테스트·배포 |","id":18},{"part":1,"partTitle":"AI 작업 방식 지도","label":"같은 일, 다른 방식","style":"콘텐츠","title":"같은 프로그램 준비도 이렇게 달라집니다","subtitle":"어떤 결과까지 맡기는지에 따라 사용 방식이 바뀍니다.","body":"| 사용 방식 | 요청 예시 | AI가 하는 일 | 사람이 확인할 일 |\n| --- | --- | --- | --- |\n| **생성형 AI** | “여름방학 프로그램 주제와 활동 초안을 만들어 줘.” | 주제·일정·활동 아이디어 초안 작성 | 아동 연령, 안전, 예산, 센터 상황 |\n| **업무 에이전트** | “회의록과 공개 견적을 읽고 일정표·예산표·안내문을 만들어 줘.” | 자료 탐색→표·문서 제작→대조→확인 요청 | 숫자·수신자·개인정보·발송 여부 |\n| **코딩 에이전트** | “프로그램 신청 웹페이지 복사본을 수정하고 테스트해 줘.” | 코드 탐색→파일 수정→테스트→오류 수정→변경 요약 | 수집 항목, 보안, 접근성, 운영 배포 |","id":19},{"part":1,"partTitle":"AI 작업 방식 지도","label":"제품 선택 전 네 문제","style":"콘텐츠","title":"제품명보다 네 가지를 먼저 봅니다","subtitle":"이 네 문제에 답하면 생성형·업무용·코딩용 중 어느 방식이 중심인지 보입니다.","body":"1. **무엇을 받는가?** — 질문과 자료인가, 완료할 목표인가, 코드 요구사항인가?\n2. **어떤 도구를 쓰는가?** — 대화·검색인가, 문서·메일·일정인가, 저장소·터미널·테스트인가?\n3. **무엇을 남기는가?** — 답변과 초안인가, 완성 결과물인가, 코드 변경과 테스트인가?\n4. **어디서 사람이 승인하는가?** — 사실·해석, 외부 행동, 보안·배포 중 어디인가?\n\n📌 핵심은 ‘할 수 있다/없다’가 아니라 **어떤 목적·환경·검토 방식에 더 잘 맞는가**입니다.","id":20},{"part":1,"partTitle":"AI 작업 방식 지도","label":"2026년 10월 28일 공식 자료 기준","style":"콘텐츠","title":"세 회사의 AI 서비스 지도","subtitle":"이 표는 배타적 구분이 아니라 초보자를 위한 대표 사용 목적 분류입니다.","body":"| 회사 | 대화·생성 중심 | 일반 업무용 에이전트 | 개발·코딩용 에이전트 |\n| --- | --- | --- | --- |\n| **앤트로픽** | Claude | Claude의 업무 수행 기능 *(Cowork 통합 중)* | Claude Code |\n| **구글** | Gemini 앱 | Gemini Spark *(individual)* / Gemini agent *(enterprise)* | Google Antigravity IDE |\n| **오픈AI** | ChatGPT의 Chat | ChatGPT Work | Codex |\n\n※ 같은 제품이 생성·업무 실행·코딩 기능을 함께 제공할 수 있습니다. 기능·명칭·화면·한도는 요금제·국가·기기·계정·조직 설정·순차 출시에 따라 달라질 수 있습니다.","id":21},{"part":1,"partTitle":"AI 작업 방식 지도","label":"앤트로픽 Anthropic","style":"콘텐츠","title":"Claude에서 Claude Code까지","subtitle":"Claude는 대화와 생성, 업무 수행, 개발 작업을 서로 다른 환경에서 제공합니다.","body":"| 구분 | 역할 | 주요 작업 |\n| --- | --- | --- |\n| **Claude** | 대화·생성 중심 | 질문, 글쓰기, 요약, 조사, 문서 분석 |\n| **Claude의 업무 수행 기능** | 일반 업무 에이전트 | 파일·연결 도구·브라우저로 조사·분석·문서·표·발표자료 제작 |\n| **Claude Code** | 개발·코딩 에이전트 | 저장소 탐색, 코드 수정, 명령·테스트 실행, 디버깅, 변경 검토 |\n\n📌 Cowork는 폐기된 개념이 아니라 **Claude의 일반 대화 경험으로 통합 중인 업무 수행 기능**입니다. 계정에 따라 Cowork 명칭이 아직 보일 수 있습니다.\n\n[공식 제품 개요](https://claude.com/product/overview) · [Cowork 통합 안내](https://claude.com/resources/articles/cowork-is-now-claude) · [Claude Code 사용 예](https://support.claude.com/en/articles/14553517-claude-code-common-developer-use-cases)","id":22},{"part":1,"partTitle":"AI 작업 방식 지도","label":"구글 Google","style":"콘텐츠","title":"개인용 Spark와 기업용 Gemini agent","subtitle":"둘 다 일반 업무를 수행하지만, 사용 대상과 연결 환경이 다릅니다.","body":"| 구분 | 사용 대상 | 중심 역할 |\n| --- | --- | --- |\n| **Gemini 앱** | 개인 사용자 | 질문, 글쓰기, 자료 분석, 이미지·영상 등 콘텐츠 생성 |\n| **Gemini Spark** | 개인 사용자 | 연결된 앱과 파일을 활용해 여러 단계의 개인 업무 수행 |\n| **Gemini agent** | 기업·조직 | 기업 데이터·업무 시스템·권한 체계에 연결된 범용 업무 에이전트 |\n\n📌 Spark와 Gemini agent를 같은 제품처럼 말하지 말고 **개인용과 조직용**으로 나누어 설명합니다.\n\n[Gemini 개요](https://gemini.google/overview/) · [Gemini Spark 발표](https://blog.google/innovation-and-ai/products/gemini-app/next-evolution-gemini-app/) · [기업용 Gemini agent](https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026)","id":23},{"part":1,"partTitle":"AI 작업 방식 지도","label":"구글 Antigravity","style":"콘텐츠","title":"Antigravity App과 IDE는 다릅니다","subtitle":"Antigravity 전체를 코딩 전용으로 분류하면 부정확합니다.","body":"| 구분 | 주요 역할 | 작업 환경 |\n| --- | --- | --- |\n| **Antigravity App** | 여러 프로젝트와 에이전트를 실행·감시·조정하는 범용 멀티에이전트 플랫폼 | 프로젝트·에이전트 관리 화면 |\n| **Antigravity IDE** | 앱·웹사이트 개발, 코드 수정, 테스트·검증 | 편집기·터미널·브라우저가 결합된 개발 환경 |\n\n📌 강의 표의 코딩용 에이전트 칸에는 **Google Antigravity IDE**라고 정확히 쓰는 것이 좋습니다.\n\n[Antigravity App](https://antigravity.google/product/antigravity-2) · [Antigravity IDE](https://antigravity.google/product/antigravity-ide)","id":24},{"part":1,"partTitle":"AI 작업 방식 지도","label":"오픈AI OpenAI","style":"콘텐츠","title":"ChatGPT의 Chat, Work, Codex","subtitle":"ChatGPT는 전체 서비스 이름이며 Chat·Work·Codex는 중심 작업 방식이 다릅니다.","body":"| 구분 | 중심 역할 | 대표 작업 |\n| --- | --- | --- |\n| **ChatGPT의 Chat** | 대화·생성 중심 | 질문, 검색, 설명, 요약, 아이디어, 초안 작성 |\n| **ChatGPT Work** | 일반 업무 에이전트 | 자료와 연결 도구로 조사·분석하고 문서·표·발표자료·보고서·사이트 등 검토 가능한 결과물 제작 |\n| **Codex** | 개발·코딩 에이전트 | 저장소 탐색, 코드 작성·수정, 명령·테스트 실행, 변경 검토, PR 준비 |\n\n📌 이전의 ChatGPT agent 명칭은 현재 긴 다단계 업무용 **ChatGPT Work**로 안내됩니다.\n\n[ChatGPT 사용 안내](https://learn.chatgpt.com/docs/use-chatgpt) · [Work와 Codex 비교](https://help.openai.com/en/articles/20001275-chatgpt-work-and-codex) · [Codex 안내](https://help.openai.com/en/articles/11369540-using-codex-with-your-chatgpt-plan)","id":25},{"part":1,"partTitle":"AI 작업 방식 지도","label":"기능의 겹침","style":"콘텐츠","title":"AI 제품은 한 칸에만 머물지 않습니다","subtitle":"가능·불가능이 아니라 어떤 작업 환경과 검토 방식에 중심을 두는지로 구분합니다.","body":"* ChatGPT Work도 코드와 셀 명령을 실행할 수 있고, Codex도 일부 비개발 작업을 도울 수 있습니다.\n* 기업용 Gemini agent도 지식업무·미디어 생성·코드 실행을 넘나들 수 있습니다.\n* 통합 중인 Claude도 대화 안에서 빠른 답변·파일·검색·코드 실행을 오갈 수 있습니다.\n\n**그래서 이름보다 다음을 봅니다.**\n\n| 판별 기준 | 확인할 내용 |\n| --- | --- |\n| 도구 | 검색·파일·앱·터미널 중 무엇을 쓰는가? |\n| 권한 | 읽기·생성·수정·전송 중 어디까지 허용했는가? |\n| 환경 | 대화창·업무 앱·개발 저장소 중 어디에서 일하는가? |\n| 승인 | 어떤 행동 전에 누가 멈추고 확인하는가? |","id":26},{"part":1,"partTitle":"AI 작업 방식 지도","label":"에이전트 업무 위임 카드","style":"콘텐츠","title":"에이전트에게 일을 맡길 때 필요한 다섯 가지","subtitle":"목표·자료·도구·승인·검토를 먼저 적으면 자율성과 책임의 경계가 분명해집니다.","body":"1. **목표와 완료 기준** — 무엇을 완성하고 어떤 조건을 통과해야 하는가?\n2. **접근할 자료** — 공개 자료·가명 처리 자료 중 무엇을 읽을 수 있는가?\n3. **사용할 도구** — 검색·문서·이메일·일정·웹페이지 중 무엇을 허용하는가?\n4. **승인받을 행동** — 전송·게시·기록 수정·삭제 전에 어디서 멈추는가?\n5. **사람이 검토할 결과** — 근거·만든 파일·남은 의문·실행 기록을 어떻게 보고하는가?\n\n**실전 요청 예시**\n\n“공개된 프로그램 자료만 읽고 일정표·예산표·보호자 안내문 초안을 만들어 주세요. 원본은 수정하지 말고 복사본에 작업하세요. 전송·일정 등록·삭제는 하지 말고 먼저 담당자 승인을 요청하세요.”","id":27},{"id":28,"part":1,"partTitle":"마인드셋 (Mindset)","label":"권한과 사람 승인 · 1/2","style":"콘텐츠","title":"AI가 할 수 있어도, 사람이 승인해야 할 일 ①","subtitle":"자율성은 무승인이 아니라 정해진 범위 안에서 다음 행동을 선택하는 능력입니다.","body":"| 권한 단계 | 센터 예시 | 기본 원칙 |\n| --- | --- | --- |\n| 읽기 | 공개 공문·운영 지침·가명 회의록 검색 | 필요한 자료만 최소 범위로 허용 |\n| 생성 | 요약·안내문·일정 후보 만들기 | 초안임을 표시하고 근거 확인 |\n| 수정 | 문서·파일·일정 변경 | 복사본 또는 되돌릴 수 있는 환경에서 실행 |"},{"id":29,"part":1,"partTitle":"마인드셋 (Mindset)","label":"권한과 사람 승인 · 2/2","style":"콘텐츠","title":"AI가 할 수 있어도, 사람이 승인해야 할 일 ②","subtitle":"자율성은 무승인이 아니라 정해진 범위 안에서 다음 행동을 선택하는 능력입니다.","body":"| 권한 단계 | 센터 예시 | 기본 원칙 |\n| --- | --- | --- |\n| 전송·공개 | 문자·메일·블로그·홈페이지 게시 | 수신자·내용·사진·첨부를 담당자 승인 후 실행 |\n| 삭제·결제·권한 변경 | 기록 삭제·구매·계정 권한 | 자동 실행 금지, 책임자 별도 승인 |\n\n📌 아동에 대한 판단, 보호자 관계, 개인정보 처리와 최종 책임은 위임할 수 없습니다."},{"part":1,"partTitle":"마인드셋 (Mindset)","label":"DX에서 AX로","style":"콘텐츠","title":"DX에서 AX로: 디지털화 다음은 AI 중심 업무 재설계","subtitle":"DX는 데이터를 흐르게 만들고, AX는 AI와 사람이 함께 일하도록 역할·절차·승인 지점을 다시 설계합니다.","body":"| 구분 | DX (Digital Transformation) | AX (AI Transformation) |\n| --- | --- | --- |\n| 핵심 질문 | 이 업무를 어떻게 디지털화할까? | AI가 맡을 일과 사람이 책임질 판단은 무엇인가? |\n| 중심 기술 | 클라우드, 모바일, 데이터베이스, 협업 도구, 자동화 | 생성형 AI, RAG, AI 에이전트, 오케스트레이션 |\n| 업무 변화 | 종이·수기 업무를 시스템과 데이터로 전환 | AI를 전제로 역할·절차·승인 흐름을 다시 설계 |\n| 센터 사례 | 출결·신청·프로그램 기록을 디지털로 축적 | 신청 접수→가명 정리→담당자 검토→최소 알림 |\n| 최종 목표 | 연결·표준화·효율 향상 | 판단 지원·창조·실행과 더 나은 돌봄 가치 |\n\n📌 DX가 데이터와 시스템의 기초를 놓는다면, AX는 그 위에서 AI와 사람이 함께 일하는 방식을 다시 설계합니다. 최종 판단과 아동안전 책임은 언제나 사람에게 있습니다.","id":30},{"id":31,"part":2,"partTitle":"AI 진화 4단계","label":"PART 2. AI 진화 4단계 · 1/2","style":"콘텐츠","title":"AI 에이전트의 핵심: 오케스트레이션 ①","subtitle":"오케스트레이션은 모델·자료·도구를 연결하는 것뿐 아니라 권한, 승인 지점, 실행 기록까지 조율하는 일입니다.","body":"* 목표: 무엇을 완료해야 하는가?\n* 지침: 반드시 지킬 규칙과 금지선은 무엇인가?\n* 지식: 어떤 자료를 근거로 사용할 것인가?\n* 도구: 검색·문서·메일·일정·코드 중 무엇을 쓸 수 있는가?\n* 환경: 대화창·업무 앱·저장소 중 어디에서 일하는가?\n* 승인: 외부 발송·공개·삭제·결제 전에 누가 확인하는가?\n* 기록: 무엇을 읽고 어떤 도구를 실행했는지 남는가?"},{"id":32,"part":2,"partTitle":"AI 진화 4단계","label":"PART 2. AI 진화 4단계 · 2/2","style":"콘텐츠","title":"AI 에이전트의 핵심: 오케스트레이션 ②","subtitle":"오케스트레이션은 모델·자료·도구를 연결하는 것뿐 아니라 권한, 승인 지점, 실행 기록까지 조율하는 일입니다.","body":"📌 지휘자는 연주만 시키지 않습니다. 악보, 역할, 출입 권한, 멈춤 신호와 공연 기록까지 관리합니다."},{"id":33,"part":2,"partTitle":"AI 진화 4단계","label":"AI 작업 방식 비교 · 1/2","style":"콘텐츠","title":"무엇을 만들고, 어디까지 맡길 것인가? ①","subtitle":"생성형 AI는 초안, 업무 에이전트는 업무 흐름, 코딩 에이전트는 소프트웨어 변경과 검증에 강합니다.","body":"| 판별 질문 | 생성형 AI | 업무용 에이전트 | 코딩용 에이전트 |\n| --- | --- | --- | --- |\n| 주요 입력 | 질문·자료 | 목표·완료 조건 | 요구사항·코드 저장소 |\n| 도구 사용 | 대화·검색·첨부 | 문서·메일·일정·브라우저 | 파일·터미널·테스트·개발 도구 |"},{"id":34,"part":2,"partTitle":"AI 진화 4단계","label":"AI 작업 방식 비교 · 2/2","style":"콘텐츠","title":"무엇을 만들고, 어디까지 맡길 것인가? ②","subtitle":"생성형 AI는 초안, 업무 에이전트는 업무 흐름, 코딩 에이전트는 소프트웨어 변경과 검증에 강합니다.","body":"| 판별 질문 | 생성형 AI | 업무용 에이전트 | 코딩용 에이전트 |\n| --- | --- | --- | --- |\n| 센터 운영 예시 | 프로그램 요약, 소집단 프로그램 질문 | 회의록에서 할 일·일정·메일 초안 | 행사 페이지 수정과 접근성 테스트 |\n| 반드시 확인 | 사실·인용·기관 지침·문체 | 수신자·개인정보·외부 행동 | 변경 내용·보안·테스트·배포 |\n\n📌 쉬운 비유: **생성형 AI는 초안 동료, 업무 에이전트는 도구를 든 신입 직원, 코딩 에이전트는 테스트 환경에서 일하는 개발 실무자**입니다."},{"id":35,"part":3,"partTitle":"AI 지식 구조 & 신뢰도","label":"PART 3. AI 지식 구조 & 신뢰도","style":"콘텐츠","title":"AI는 어디에서 답을 가져오는가?","subtitle":"모델 지식, 웹 검색, 연결된 조직 자료, 사용자가 올린 자료는 최신성과 신뢰 조건이 서로 다릅니다.","body":"| 답의 근거 | 장점 | 확인할 점 |\n| --- | --- | --- |\n| 모델이 배운 일반 지식 | 빠른 설명·아이디어 | 학습 범위·날짜·출처가 불분명할 수 있음 |\n| 웹 검색 | 최근 공개 자료 접근 | 게시 날짜·원출처·상충 자료·검색 누락 확인 |\n| 연결된 조직 자료 | 규정·업무 문서에 맞춘 답 | 접근 권한·최신 버전·공유 범위 확인 |\n| 업로드한 자료 | 지정 자료 중심 요약·질문 | 자료 자체의 오류·누락·인용 위치 확인 |\n\n📌 “최신인가?”만 묻지 말고 **어디에서 가져왔고 원문으로 확인할 수 있는가**를 물으십시오."},{"id":36,"part":3,"partTitle":"AI 지식 구조 & 신뢰도","label":"검색과 생성의 결합","style":"콘텐츠","title":"검색 엔진과 생성형 AI는 이제 함께 작동합니다","subtitle":"현재의 AI는 필요할 때 웹을 검색하거나 연결된 자료를 찾아 답을 만들 수 있습니다.","body":"| 방식 | 잘하는 일 | 남는 위험 |\n| --- | --- | --- |\n| 검색만 사용 | 원문 목록과 최신 공개 정보 찾기 | 광고·오래된 문서·상충 자료를 사용자가 비교해야 함 |\n| 모델 지식만 사용 | 배경 설명·초안·아이디어 | 날짜·인용·세부 사실이 틀릴 수 있음 |\n| 검색 연결 AI | 질문을 풀어 검색하고 요약 | 잘못된 검색어·출처 선택·요약 누락 가능 |\n| 조직 자료 연결 AI | 지정 자료를 찾아 근거 기반 답변 | 권한·자료 버전·원문 인용을 확인해야 함 |\n\n📌 웹 검색은 최신 자료 접근에 유리하지만 **최신성 100%를 보장하지 않습니다. 날짜·원출처·상충 자료를 함께 확인**하십시오."},{"id":37,"part":3,"partTitle":"AI 지식 구조 & 신뢰도","label":"PART 3. AI 지식 구조 & 신뢰도","style":"콘텐츠","title":"환각은 확률보다 위험과 검증 난이도로 판단합니다","subtitle":"틀릴 가능성뿐 아니라 틀렸을 때의 피해가 큰 작업일수록 더 강한 검증과 사람 승인이 필요합니다.","body":"| 작업 | 검증 난이도 | 틀렸을 때 영향 | 권장 사용법 |\n| --- | --- | --- | --- |\n| 아이디어·제목 후보 | 낮음 | 낮음 | 여러 안을 만들고 사람이 선택 |\n| 요약·교육 자료 초안 | 중간 | 중간 | 원문 대조와 인용 확인 |\n| 공식 지침 해석·기관 지침 주장 | 높음 | 높음 | 본문·주석·교단 관점과 돌봄 종사자 검토 |\n| 개인정보·상담·재정·법률 | 높음 | 매우 높음 | 최소 입력, 전문 담당자와 최종 승인 |\n\n📌 숫자로 된 고정 신뢰도보다 **근거 확인 가능성 × 오류의 영향**으로 검수 수준을 정하십시오."},{"id":38,"part":3,"partTitle":"AI 지식 구조 & 신뢰도","label":"근거 기반 워크플로우","style":"콘텐츠","title":"오류 가능성을 낮추는 5단계 돌봄 업무 워크플로우","subtitle":"AI를 검수했다고 오류가 사라지는 것은 아닙니다. 근거와 승인 과정을 반복 가능하게 만드십시오.","body":"1. **수집** — 사용할 자료의 범위와 최신 버전을 정합니다.\n2. **원출처 확인** — 공식 지침 본문·공식 문서·센터 규정을 직접 확인합니다.\n3. **AI 가공** — 요약·분류·초안·대안을 만들게 합니다.\n4. **주장 대조** — 인용·숫자·날짜·기관 지침적 주장을 원문과 비교합니다.\n5. **담당자 승인** — 공개·발송·적용 전에 책임자가 최종 판단합니다.\n\n📌 목표는 ‘오류 없음’이 아니라 **오류를 발견하고 되돌릴 수 있는 과정**입니다."},{"id":39,"part":3,"partTitle":"AI 지식 구조 & 신뢰도","label":"AI 선택 체크리스트","style":"콘텐츠","title":"제품 순위보다 중요한 여섯 가지 선택 기준","subtitle":"모델 이름과 가격은 자주 바뀝니다. 이번 업무에 필요한 조건으로 제품군을 고르십시오.","body":"| 선택 기준 | 확인 질문 |\n| --- | --- |\n| 업무 | 답변·자료 연구·업무 실행·코딩 중 무엇을 완료해야 하는가? |\n| 근거 | 웹·업로드 자료·조직 문서의 출처를 추적할 수 있는가? |\n| 도구 | 문서·메일·일정·브라우저·코드 저장소 중 무엇에 연결되는가? |\n| 권한 | 읽기·생성·수정·전송 중 어디까지 허용할 것인가? |\n| 안전 | 개인정보·저작권·보안·사람 승인·실행 기록을 관리할 수 있는가? |\n| 비용·운영 | 구독·API·저장·호스팅·검수·유지보수 비용은 얼마인가? |\n\n📌 제품명과 요금은 **강의일 기준 부록**으로 확인하고, 본문에서는 오래가는 판별 기준을 익힙니다."},{"part":3,"partTitle":"AI 지식 구조 & 신뢰도","label":"AI 생태계 여섯 층","style":"콘텐츠","title":"회사부터 에이전트 제작까지, 여섯 층으로 구분하세요","subtitle":"회사·모델·사용자 제품·에이전트·제작 도구는 같은 종류가 아닙니다.","body":"| 층 | 초보자용 정의 | 판별 질문 | 예시 |\n| --- | --- | --- | --- |\n| AI 회사 | 기술과 제품을 만드는 주체 | 누가 만들었나? | OpenAI, Anthropic, Google, Microsoft |\n| 모델·모델군 | 이해하고 생성하는 엔진 | 무슨 두뇌가 작동하나? | GPT, Claude, Gemini 계열 |\n| 생성형 AI 어시스턴트 | 대화로 답과 콘텐츠를 만드는 제품 | 무엇을 만들까? | ChatGPT, Claude, Gemini, Copilot Chat |\n| 업무용 에이전트 | 업무 앱에서 다단계 일을 수행 | 업무 과정을 어디까지 맡길까? | 문서·메일·일정·브라우저 에이전트 |\n| 코딩용 에이전트 | 저장소를 읽고 수정·테스트 | 소프트웨어 변경을 맡길까? | Codex, Claude Code, Copilot coding agent |\n| 에이전트 제작 도구 | 지식·도구·권한·승인을 조합 | 우리 조직용 일꾼을 어떻게 만들까? | Agents SDK, ADK, Copilot Studio 등 |\n\n※ 제품 예시는 강의일 기준이며 바뀔 수 있습니다. **모델은 엔진, 제품은 창구, 에이전트는 실행 시스템, 제작 도구는 작업대**입니다.","id":40},{"id":41,"part":4,"partTitle":"현장 실무자를 위한 IT 기술 (API)","label":"PART 4. 현장 실무자를 위한 IT 기술 (API)","style":"파트 표지","title":"현장 실무자와 돌봄 종사자를 위한 API 쉽게 이해하기","subtitle":"어려운 기술 용어, '식당의 웨이터' 비유로 3분 만에 마스터하기","body":"Application Programming Interface\n\n거대한 AI 시스템과 내 돌봄 업무을 이어주는 다리"},{"id":42,"part":4,"partTitle":"현장 실무자를 위한 IT 기술 (API)","label":"PART 4. 현장 실무자를 위한 IT 기술 (API)","style":"콘텐츠","title":"내가 주방에 직접 들어가지 않아도 되는 이유","subtitle":"API는 정해진 방식으로 서비스를 연결하는 창구입니다. 인증·비밀키·과금·개인정보·오류 처리는 별도로 설계해야 합니다.","body":"🍽️ 식당 웨이터 비유로 이해하는 API\n* 손님 (나 / 내 돌봄 업무 앱):\n메뉴판을 보고 웨이터에게 주문합니다.\n* 웨이터 (API):\n주문을 받아 주방에 전달하고, 완성된 요리를 손님에게 안전하게 배달합니다.\n* 주방 (거대한 AI 서버):\n복잡한 요리(AI 연산)를 직접 처리하여 결과만 웨이터에게 넘깁니다."},{"id":43,"part":4,"partTitle":"현장 실무자를 위한 IT 기술 (API)","label":"클라우드·로컬·하이브리드 · 1/2","style":"콘텐츠","title":"지역 돌봄지 환경에 따른 AI 실행 방식 선택 ①","subtitle":"온라인과 오프라인의 이분법보다 연결성·성능·보안·운영 능력을 함께 비교합니다.","body":"| 방식 | 장점 | 제약과 위험 | 적합한 상황 |\n| --- | --- | --- | --- |\n| 클라우드 서비스/API | 강한 모델·빠른 업데이트·협업 | 인터넷·요금·외부 전송·서비스 정책 | 공개 자료, 일반 문서, 빠른 협업 |\n| 로컬·온디바이스 | 외부 전송 감소·오프라인 가능 | 기기 성능·설치·업데이트·분실·백업 위험 | 연결이 약한 지역, 제한된 내부 자료 |"},{"id":44,"part":4,"partTitle":"현장 실무자를 위한 IT 기술 (API)","label":"클라우드·로컬·하이브리드 · 2/2","style":"콘텐츠","title":"지역 돌봄지 환경에 따른 AI 실행 방식 선택 ②","subtitle":"온라인과 오프라인의 이분법보다 연결성·성능·보안·운영 능력을 함께 비교합니다.","body":"| 방식 | 장점 | 제약과 위험 | 적합한 상황 |\n| --- | --- | --- | --- |\n| 하이브리드 | 민감도에 따라 나누어 사용 | 구조와 권한 관리가 복잡 | 공개 정보는 클라우드, 민감 자료는 내부 처리 |\n\n📌 로컬 실행도 100% 안전하지 않습니다. **기기 암호화·계정 권한·백업·악성코드·물리적 분실**을 관리해야 합니다."},{"id":45,"part":4,"partTitle":"센터 업무를 잇는 IT 기술 (API)","label":"PART 4. 센터 업무를 잇는 IT 기술 (API)","style":"콘텐츠","title":"돌봄 업무를 연결하는 3가지 대표 API","subtitle":"API는 기능을 빌려 쓰는 연결 수단입니다. 요금·데이터 처리·키 관리·사용 한도를 공식 문서에서 확인합니다.","body":"1. 문자·메신저 API\n\n신청 접수나 일정 변경이 생기면 식별정보가 없는 최소 알림을 담당자에게 보냅니다.\n\n2. 생성형 AI API\n\n공개 프로그램 기록을 블로그 글·소식지·안내문 초안으로 바꿉니다.\n\n3. 지도 API\n\n센터 위치, 행사장, 귀가 동선 등 공개 가능한 위치 정보를 안내 페이지에 표시합니다.\n\n📌 API 키는 비밀번호처럼 보관하고, 아동 개인정보를 외부 서비스로 보낼 때는 기관 규정·법적 근거·계약 조건을 먼저 확인합니다."},{"id":46,"part":5,"partTitle":"소통의 기술 (프롬프트)","label":"PART 5. 소통의 기술 (프롬프트)","style":"파트 표지","title":"AI와 깊이 소통하는 질문의 기술","subtitle":"좋은 질문의 4가지 원칙(ACTF)부터 목표 제시(Goal-Driven), 핑퐁 대화법까지","body":"ACTF 공식 & Goal-Driven Prompting\n\n질문이 바뀌면 돌봄 업무의 결과물이 바뀝니다"},{"id":47,"part":5,"partTitle":"소통의 기술 (프롬프트)","label":"PART 5. 소통의 기술 (프롬프트) · 1/2","style":"콘텐츠","title":"좋은 요청의 4요소: 역할·맥락·과업·형식 ①","subtitle":"공식을 외우기보다 목표·자료·제약·성공 기준이 빠지지 않았는지 확인하십시오.","body":"A (Act as)\n\n역할 부여 — “아동복지 현장을 이해하는 프로그램 기획자로서...”\n\nC (Context)\n\n배경 설명 — “초등 저학년 15명과 고학년 10명이 함께 이용하며...”\n\nT (Task)\n\n임무 지시 — “4주 방학 프로그램 계획 초안을 작성해 줘.”"},{"id":48,"part":5,"partTitle":"소통의 기술 (프롬프트)","label":"PART 5. 소통의 기술 (프롬프트) · 2/2","style":"콘텐츠","title":"좋은 요청의 4요소: 역할·맥락·과업·형식 ②","subtitle":"공식을 외우기보다 목표·자료·제약·성공 기준이 빠지지 않았는지 확인하십시오.","body":"F (Format)\n\n형식 지정 — “주차별 표로 목표·준비물·안전 확인·담당자를 포함해 줘.”\n\n📌 공식보다 중요한 것은 목표·자료·제약·성공 기준과 개인정보 금지 범위를 함께 적는 것입니다."},{"id":49,"part":5,"partTitle":"소통의 기술 (프롬프트)","label":"PART 5. 소통의 기술 (프롬프트)","style":"콘텐츠","title":"정답을 묻지 말고, '최종 목표'를 제시하십시오","subtitle":"AI에게 목적지를 알려주면 실행 가능한 여러 경로를 제안합니다.","body":"❌ 단순 질문 방식\n\n“여름방학 프로그램 추천해 줘.”\n\n👉 결과: 센터 상황과 아동 연령을 반영하지 못한 일반적인 목록\n\n⭕ 목표 제시 방식 (Goal-Driven)\n\n“초등 3~6학년 아동이 여름방학 동안 협력과 자기표현을 익히도록 돕는 것이 목표야. 예산 30만원, 실내 중심, 4주 프로그램 기획안과 안전 점검표를 제안해 줘.”\n\n👉 결과: 목표·대상·예산·제약을 반영한 검토 가능한 초안"},{"id":50,"part":5,"partTitle":"소통의 기술 (프롬프트)","label":"PART 5. 소통의 기술 (프롬프트)","style":"콘텐츠","title":"탁구 치듯 대화하는 '핑퐁 대화법'","subtitle":"첫 답을 정답으로 받지 말고 정확성·공감·실행 가능성의 세 기준으로 비평하고 개선합니다.","body":"1. 가벼운 첫 질문\n\n완벽을 바라지 말고 부담 없이 큰 틀의 초안(60점)을 빠르게 만듭니다.\n\n2. 구체적인 피드백\n\n“문체가 너무 딱딱해. 초등학생 보호자가 한 번에 이해할 말로 바꿔 줘.”\n“우리 센터 예산과 운영 시간에 맞는 예시 2개만 추가해 줘.”\n\n3. 기준으로 다시 검토\n\n“지금 초안에서 사실이 불확실한 부분, 현장에서 실행하기 어려운 부분, 개인정보가 드러날 수 있는 부분을 구분해 고쳐 줘.”\n\n📌 점수보다 **무엇이 부족한지 구체적으로 말하는 피드백**이 더 좋은 결과를 만듭니다."},{"id":51,"part":5,"partTitle":"소통의 기술 (프롬프트)","label":"PART 5. 소통의 기술 (프롬프트)","style":"콘텐츠","title":"질문 품질을 높이는 네 가지 실전 점검","subtitle":"자료를 충분히 주되 화면 캡처·문서에서 개인정보와 비밀정보는 먼저 가립니다.","body":"1. 대화체 질문\n\n전문 용어 대신 옆 동료에게 말하듯 편안한 일상어로 질문\n\n2. 역질문 (메타)\n\n\"최고의 답을 주려면 내가 어떤 정보를 먼저 줘야 할까?\"\n\n3. 지시문 대행\n\n\"이 작업을 위한 완벽한 지시문을 ACTF 공식으로 네가 써줘.\"\n\n4. 화면 캡처 질문\n\n말로 설명하기 어려운 오류 화면은 캡처 이미지로 즉시 질문"},{"id":52,"part":6,"partTitle":"돌봄센터 실전 프롬프트","label":"PART 6. 돌봄센터 실전 프롬프트","style":"파트 표지","title":"돌봄센터 종사자를 위한 실전 프롬프트 라이브러리","subtitle":"연간 사업계획, 프로그램 교안, 보호자 소통까지 즉시 고쳐 쓰는 실전 예시","body":"CHILDCARE CENTER & AI WORKBOOK\n\n공개 자료와 가명 정보로 안전하게 연습하는 프롬프트 3선"},{"id":53,"part":6,"partTitle":"돌봄센터 실전 프롬프트","label":"PART 6. 돌봄센터 실전 프롬프트","style":"콘텐츠","title":"[실전 1] 연간 사업계획서 초안 프롬프트","subtitle":"연도·이용 인원·중점 목표·예산·담당자를 자리표시자로 넣고 실제 공문과 예산을 담당자가 검토합니다.","body":"💻 [복사용 프롬프트]\n\n[역할] 당신은 지역아동센터와 다함께돌봄센터의 프로그램 기획을 돕는 행정 보조자입니다.\n[배경] 초등학생 [ ]명이 이용하며 올해 중점 목표는 [ ]입니다.\n[임무] 1월부터 12월까지 연간 사업계획 초안을 작성해 주세요.\n[형식] 월별 표로 [주요 프로그램], [교육·돌봄 목표], [준비물], [예산 등급], [안전 확인], [담당자] 열을 포함하세요.\n[제약] 실제 아동 이름·연락처·상담 내용은 사용하지 마세요.\n\n📌 기관 공문, 운영 지침, 실제 예산과 일정을 담당자가 대조한 뒤 확정합니다."},{"id":54,"part":6,"partTitle":"돌봄센터 실전 프롬프트","label":"PART 6. 돌봄센터 실전 프롬프트","style":"콘텐츠","title":"[실전 2] 4주 프로그램 교안 만들기","subtitle":"연령·목표·시간·공간·준비물·안전 조건을 넣어 현장에 맞는 교안을 만듭니다.","body":"💻 [복사용 프롬프트]\n\n[역할] 초등 아동 발달과 놀이 활동을 이해하는 교육 기획자입니다.\n[대상] 초등 3~6학년 12명, 회기당 60분.\n[목표] 협력과 자기표현을 연습하는 4주 프로그램 교안을 작성해 주세요.\n[형식] 매주 1. 도입 2. 핵심 활동 3. 나눔 4. 준비물 5. 안전 확인 6. 관찰 포인트를 포함하세요.\n[제약] 진단·낙인·위험 점수를 만들지 말고, 관찰 문장은 사실과 해석을 구분하세요.\n\n📌 종사자가 아동의 실제 반응과 센터 환경을 보며 난이도와 안전 절차를 조정합니다."},{"id":55,"part":6,"partTitle":"돌봄센터 실전 프롬프트","label":"PART 6. 돌봄센터 실전 프롬프트","style":"콘텐츠","title":"[실전 3] 보호자 상담과 갈등 대화 준비","subtitle":"AI는 대화 준비를 돕지만 당사자의 목소리와 사회복지 실천 판단을 대신하지 않습니다.","body":"💻 [복사용 프롬프트]\n\n[역할] 존중과 비난 없는 의사소통을 돕는 상담 준비 보조자입니다.\n[상황] 가명 아동 A가 최근 프로그램 참여를 어려워하고, 보호자와 사실을 공유할 대화를 준비합니다.\n[임무] 관찰 사실, 확인이 필요한 질문, 보호자에게 설명할 문장, 함께 정할 다음 행동을 구분해 주세요.\n[금지] 원인을 단정하거나 가정환경을 추정하거나 진단하지 마세요.\n\n📌 이름·연락처·가족관계·건강·학교·상담 내용은 제거하거나 가명 처리하고, 실제 연락 전 담당자 승인을 받습니다."},{"id":56,"part":7,"partTitle":"기관 지식 비서 & 세컨드 브레인","label":"PART 7. 기관 지식 비서 & 세컨드 브레인","style":"파트 표지","title":"나만의 기관 지식 비서와 세컨드 브레인","subtitle":"운영 지침·공문·프로그램 기록을 연결해 찾고 원문으로 확인하는 지식체계","body":"LLM Wiki & Second Brain for Childcare\n\n쌓여 있는 센터 자료를 찾고 검증 가능한 업무 자산으로 만드는 법"},{"id":57,"part":7,"partTitle":"기관 지식 비서 & 세컨드 브레인","label":"PART 7. 기관 지식 비서 & 세컨드 브레인","style":"콘텐츠","title":"센터 자료를 연결하는 '세컨드 브레인'","subtitle":"자료를 자동 학습시키는 것이 아니라 정리·색인·검색하고 필요한 부분을 답변 문맥에 연결합니다.","body":"1. 유기적 지식망\n* 운영 지침, 지자체 공문, 프로그램 계획·평가, 공개용 서식을 연도·사업·주제별로 연결\n* “어디에 있는지 몰라 다시 만드는 일”을 줄이는 기관 지식 지도\n\n2. 필요한 순간의 인출\n* “작년 여름방학 계획과 올해 지자체 공문의 달라진 점을 표로 정리해 줘.”\n* 답변에 문서명·페이지·문단을 표시하게 하고 담당자가 원문 대조"},{"id":58,"part":7,"partTitle":"기관 지식 비서 & 세컨드 브레인","label":"근거 연결과 검증","style":"콘텐츠","title":"기관 자료에 근거하고, 원문으로 검증하는 AI","subtitle":"Source Grounding과 RAG는 오류를 줄이고 출처 추적을 돕지만 정확성·적법성·현장 판단을 보증하지 않습니다.","body":"1. **자료 범위 지정** — 사용할 법령·운영 지침·지자체 공문·센터 규정을 정합니다.\n2. **관련 부분 검색** — 질문과 가까운 조항·문단을 찾아 답변 문맥에 넣습니다.\n3. **근거 표시 요청** — 문서명·시행일·페이지·문단을 함께 제시하게 합니다.\n4. **원문 대조** — 인용이 실제 원문과 같은지 직접 확인합니다.\n5. **현장 판단** — 적용은 시설장·담당자가 아동 상황과 기관 규정을 고려해 결정합니다.\n\n📌 파일을 모델이 새로 ‘학습’한 것이 아니라 **필요한 자료를 찾아 답변에 참고하는 검색 기반 방식(RAG)**입니다."},{"id":59,"part":7,"partTitle":"기관 지식 비서 & 세컨드 브레인","label":"PART 7. 기관 지식 비서 & 세컨드 브레인","style":"콘텐츠","title":"자료 기반 AI에서 익힐 두 가지: 근거 추적과 오디오 개요","subtitle":"선택한 공개·내부 자료를 바탕으로 질문하고, 인용과 음성 요약을 원문과 대조합니다.","body":"🔍 인용으로 원문 대조하기\n* 답변 옆의 인용 표시를 눌러 해당 자료와 위치를 확인합니다.\n* 인용은 확인의 시작점입니다. 시행일, 문맥, 누락된 예외를 직접 비교합니다.\n\n🎙️ 오디오 개요 활용하기\n* 긴 공문과 교육자료를 이동 중 들으며 핵심 주제를 파악합니다.\n* 음성 개요도 AI가 고른 요약이므로 중요한 의무·기한·예외는 원문으로 다시 확인합니다.\n\n📌 개인정보나 비공개 사례기록은 승인된 환경과 기관 규칙 안에서만 사용합니다."},{"id":60,"part":7,"partTitle":"기관 지식 비서 & 세컨드 브레인","label":"PART 7. 기관 지식 비서 & 세컨드 브레인","style":"콘텐츠","title":"기관 자료 기반 질문 레시피 4선","subtitle":"답변마다 근거 위치와 불확실성을 표시하게 하고 담당자가 최신 원문을 확인합니다.","body":"[쉬운 요약]\n“이 운영 지침을 신규 종사자가 이해하도록 핵심 의무·기한·담당자를 표로 정리해 줘.”\n\n[변경 비교]\n“작년 지침과 올해 지침의 달라진 조항을 문서명·페이지와 함께 비교해 줘.”\n\n[점검표]\n“이 공문에서 우리 센터가 준비할 서류와 마감일을 체크리스트로 만들어 줘.”\n\n[회의 준비]\n“이 자료에서 결정해야 할 항목, 확인 질문, 근거 문단을 구분해 줘.”"},{"id":61,"part":8,"partTitle":"맞춤 앱 & 안내 웹페이지","label":"PART 8. 맞춤 앱 & 안내 웹페이지","style":"파트 표지","title":"센터 전용 생성 AI · 업무 에이전트 · 웹앱 구분하기","subtitle":"질문에 답하는 도구, 업무를 실행하는 도구, 이용자가 사용하는 웹서비스는 제작 난이도와 책임이 다릅니다.","body":"Custom AI Apps & Center Web Pages\n\n반복되는 공개 업무부터 작고 안전하게 자동화하기"},{"id":62,"part":8,"partTitle":"맞춤 앱 & 안내 웹페이지","label":"PART 8. 맞춤 앱 & 안내 웹페이지","style":"콘텐츠","title":"오늘 가능한 시제품과 심화 시스템을 나눕니다","subtitle":"공개 자료 시제품은 오늘 만들 수 있지만 개인정보·권한·데이터가 필요한 시스템은 별도 설계와 테스트가 필요합니다.","body":"| 오늘 가능한 실습 | 심화 프로젝트 |\n| --- | --- |\n| 공개 프로그램 기록으로 블로그 초안 만들기 | 아동·보호자 신청·상담·출결 데이터 시스템 |\n| 공개 운영 지침으로 근거 기반 질의응답 | 메일·일정·문서에 연결된 업무 에이전트 |\n| 안내 정적 HTML 복사본 만들기 | 로그인·권한·개인정보 수집 웹앱 |\n\n📌 목표는 “그럴듯한 시연”이 아니라 **안전한 복사본에서 만들고 근거·권한·모바일·접근성·오류를 확인하는 것**입니다."},{"id":63,"part":8,"partTitle":"맞춤 앱 & 안내 웹페이지","label":"PART 8. 맞춤 앱 & 안내 웹페이지","style":"콘텐츠","title":"보호자가 이해하기 쉬운 안내 페이지 4단계","subtitle":"사진과 후기는 동의를 받고 개인정보는 최소 수집하며 모바일·키보드·글자 크기·색 대비를 테스트합니다.","body":"1. 첫 화면 — 대상·일정·장소·비용을 3초 안에 이해\n\n2. 프로그램 설명 — 무엇을 왜 하는지 쉬운 말로 안내\n\n3. 준비와 안전 — 준비물, 귀가 방법, 문의처, 취소·변경 안내\n\n4. 신청과 확인 — 꼭 필요한 항목만 받는 신청 링크와 처리 절차\n\n📌 공개 페이지에는 아동 이름·얼굴·학교·생활기록이 드러나지 않게 하고, 사진 게시 전 동의 범위를 확인합니다."},{"id":64,"part":8,"partTitle":"맞춤 앱 & 랜딩페이지","label":"PART 8. 맞춤 앱 & 랜딩페이지","style":"콘텐츠","title":"무료로 시작하는 정적 웹 배포와 유지보수 책임","subtitle":"초기 비용 없이 시작할 수 있어도 정책·트래픽·도메인·보안 업데이트·백업 책임은 계속 남습니다.","body":"| 단계 | 확인할 내용 |\n| --- | --- |\n| 제작 | 내용·이미지 저작권, 모바일 화면, 접근성, 연락처 정확성 |\n| 테스트 | 링크·양식·다운로드·오류 화면·다른 기기에서의 표시 |\n| 배포 | 공개 범위, 호스팅 정책, 트래픽·저장 한도, 도메인 비용 |\n| 운영 | 담당자, 수정 방법, 백업, 보안 업데이트, 재검토 날짜 |\n\n📌 “평생 무료”보다 정확한 표현은 **무료로 시작할 수 있으며, 운영 조건과 비용은 바뀔 수 있다**입니다."},{"id":65,"part":8,"partTitle":"맞춤 앱 & 안내 웹페이지","label":"PART 8. 맞춤 앱 & 안내 웹페이지","style":"콘텐츠","title":"AI와 함께하는 실전 5단계: 센터 안내 페이지 만들기","subtitle":"질문 → 자료 연결 → 화면 확인 → 복사본 실행 → 매뉴얼과 담당자 인계까지 이어갑니다.","body":"1. 절차 질문 — “센터 프로그램 안내 페이지를 만들려면 무엇이 필요한가?”\n\n2. 공개 자료 연결 — 확정된 일정·대상·준비물·문의처만 제공합니다.\n\n3. 화면 캡처 확인 — 모르는 화면은 개인정보를 가린 뒤 질문합니다.\n\n4. 복사본에서 실행 — 원본을 보존하고 모바일·링크·색 대비·글자 크기를 테스트합니다.\n\n5. 매뉴얼과 인계 — 수정 방법, 담당자, 백업, 재검토 날짜를 한 장에 남깁니다."},{"id":66,"part":9,"partTitle":"바이브 코딩 & 돌봄의 본질","label":"PART 9. 바이브 코딩 & 돌봄의 본질","style":"파트 표지","title":"바이브 코딩과 돌봄의 본질","subtitle":"자연어로 코드를 만드는 속도보다 요구사항·테스트·보안·운영 책임을 끝까지 확인하는 습관이 중요합니다.","body":"Vibe Coding & Responsible Care\n\n도구를 다스리며 아동의 권리와 안전을 지키는 종사자의 길"},{"id":67,"part":9,"partTitle":"바이브 코딩 & 돌봄 업무의 본질","label":"코딩용 에이전트","style":"콘텐츠","title":"요구 → 수정 → 테스트 → 검토 → 배포 승인","subtitle":"코딩 에이전트는 자동완성을 넘어 저장소를 탐색하고 파일을 수정하며 테스트를 실행하는 개발 실무자입니다.","body":"1. **요구 정의** — 바꿀 기능, 유지할 내용, 성공 기준, 금지 범위를 적습니다.\n2. **안전한 작업 환경** — 원본이 아닌 복사본·브랜치·작업 공간에서 시작합니다.\n3. **탐색과 수정** — 관련 파일을 읽고 필요한 부분만 바꿉니다.\n4. **테스트와 수정 반복** — 오류·모바일·접근성·보안을 점검하고 실패를 고칩니다.\n5. **사람 검토** — 변경 내역, 삭제된 내용, 비밀정보, 외부 연결을 확인합니다.\n6. **배포 승인** — 운영 반영은 책임자가 승인하고 되돌릴 방법을 준비합니다.\n\n📌 “코딩 없이 5분 완성”은 시제품 이야기입니다. **공개 전 검증과 운영 책임은 생략할 수 없습니다.**"},{"id":68,"part":9,"partTitle":"바이브 코딩 & 돌봄 업무의 본질","label":"AI 운영과 총비용 · 1/2","style":"콘텐츠","title":"센터 맞춤형 확장 아이디어와 AI 운영 카드 ①","subtitle":"제품 하나를 추천하기보다 목표·데이터·권한·승인·비용·재검토 날짜를 한 장에 기록합니다.","body":"| 운영 카드 항목 | 기록할 내용 |\n| --- | --- |\n| 목표 업무 | 어떤 결과를 얼마나 자주 완성할 것인가? |\n| 데이터 등급 | 공개·내부·민감·입력 금지 중 무엇인가? |\n| 도구와 권한 | 읽기·생성·수정·전송 중 어디까지 허용하는가? |\n| 근거와 성공 기준 | 어떤 원문을 대조하고 무엇을 통과해야 하는가? |"},{"id":69,"part":9,"partTitle":"바이브 코딩 & 돌봄 업무의 본질","label":"AI 운영과 총비용 · 2/2","style":"콘텐츠","title":"센터 맞춤형 확장 아이디어와 AI 운영 카드 ②","subtitle":"제품 하나를 추천하기보다 목표·데이터·권한·승인·비용·재검토 날짜를 한 장에 기록합니다.","body":"| 운영 카드 항목 | 기록할 내용 |\n| --- | --- |\n| 승인자와 실행 기록 | 누가 최종 확인하고 어떤 기록을 남기는가? |\n| 총비용 | 구독·API·저장·호스팅·검수·실패 재작업 시간 |\n| 재검토 날짜 | 기능·가격·정책·담당자를 언제 다시 확인하는가? |\n\n📌 아동·보호자 데이터가 포함되면 개인정보 보호책임자 또는 기관 담당자의 사전 검토를 받습니다."},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"PART 9. 돌봄 현장 자동화 프로젝트","style":"파트 표지","title":"작고 안전하게 시작하는 7가지 현장 프로젝트","subtitle":"반복 업무를 줄이되 개인정보와 아동안전의 책임선은 더 분명하게 만듭니다.","body":"QR 신청서 · 블로그 글 자동작성기 · 하원 알리미 · 회의록 작성기\n\n소식지·안내지 웹페이지 · 센터 홈페이지 · 연결된 하루 업무 흐름","id":70},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"프로젝트 1 · QR 신청서","style":"콘텐츠","title":"QR 신청서 → 자료 정리 → 텔레그램 최소 알림","subtitle":"전체 신청서는 승인된 저장소에 두고 메신저에는 식별이 어려운 최소 알림만 보냅니다.","body":"1. 보호자가 QR을 찍어 신청서 접속\n2. 목적에 필요한 최소 항목만 입력\n3. 승인된 시트·데이터베이스에 저장하고 신청번호 부여\n4. 자동화가 중복·누락·처리 상태를 정리\n5. 텔레그램에는 “신규 신청 1건 · 신청번호 C-024 · 확인 필요”만 알림\n6. 담당자가 원자료를 열어 확인하고 접수 여부 결정\n\n📌 이름·전화번호·주소·학교·건강·상담 내용은 텔레그램 메시지에 넣지 않습니다.","id":71},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"신청 자동화 안전 설계 · 1/2","style":"콘텐츠","title":"최소 수집 · 가명 처리 · 담당자 승인 · 보관 기한 ①","subtitle":"빠른 자동화보다 먼저 수집 목적, 저장 장소, 접근 권한, 파기 시점을 정합니다.","body":"| 단계 | 안전 확인 |\n| --- | --- |\n| 수집 | 목적별 필수 항목과 선택 항목을 구분하고 최소 수집 |\n| 저장 | 승인된 계정·폴더만 사용하고 권한을 업무상 필요한 사람으로 제한 |\n| 처리 | 분석·시연에는 이름 대신 신청번호 등 가명 사용 |","id":72},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"신청 자동화 안전 설계 · 2/2","style":"콘텐츠","title":"최소 수집 · 가명 처리 · 담당자 승인 · 보관 기한 ②","subtitle":"빠른 자동화보다 먼저 수집 목적, 저장 장소, 접근 권한, 파기 시점을 정합니다.","body":"| 단계 | 안전 확인 |\n| --- | --- |\n| 알림 | 메신저에는 건수·신청번호·처리 상태만 최소 알림 |\n| 결정 | 접수·대기·보완 요청은 담당자 승인 후 확정 |\n| 종료 | 보관 기간이 지나면 기관 규칙에 따라 안전하게 파기 |\n\n📌 개인정보 보호법은 목적에 필요한 최소한의 개인정보 수집과 안전성 확보조치를 요구합니다. 실제 도입 전 기관 담당자가 최신 법령·규정·서비스 계약을 검토합니다.\n\n[개인정보 보호법](https://law.go.kr/법령/개인정보보호법) · [개인정보보호위원회 AI 안내](https://pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS074&mCode=&nttId=11475)","id":73},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"프로젝트 2 · 블로그","style":"콘텐츠","title":"블로그 글 자동작성기: 기록을 공개용 이야기로","subtitle":"프로그램의 의미는 살리고 아동을 알아볼 수 있는 정보는 제거합니다.","body":"입력 — 프로그램 목표, 활동 순서, 공개 가능한 결과, 담당자 확인 메모\n\nAI 작업 — 제목 3개, 600자 본문, 사진 설명, 해시태그, 맞춤법 초안\n\n사람 검토 — 사실·날짜·기관명·사진 동의·아동 식별 가능성·과장 표현 확인\n\n출력 — 블로그용 글, 보호자용 짧은 글, 홈페이지용 요약\n\n📌 얼굴 사진, 이름표, 학교·학년 조합, 특별한 사연도 아동을 알아보게 할 수 있습니다. 게시 전 공개 범위와 동의를 다시 확인합니다.","id":74},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"프로젝트 3 · 하원 알림 · 1/2","style":"콘텐츠","title":"하원 알리미: 시간이 되면 이름과 하원 예정 시각을 음성 안내 ①","subtitle":"센터 내부 기기에서만 작동하고 외부 전송과 자동 하원 처리는 분리합니다.","body":"1. 담당자가 당일 하원 예정표를 확인하고 확정\n2. 내부 기기가 시각을 감지해 “김○○ 아동, 5시 하원 준비”라고 음성 안내\n3. 종사자가 실제 보호자·귀가 방법·동행 여부를 확인\n4. 확인 후에만 하원 처리 기록\n\n**안전선**\n* 외부 스피커·개인 휴대전화·공개 공간으로 명단 전송 금지\n* 일정 변경과 보호자 연락은 자동 확정하지 않고 담당자 승인\n* 기기 장애 때 사용할 종이 명단과 수동 절차 준비","id":75},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"프로젝트 3 · 하원 알림 · 2/2","style":"콘텐츠","title":"하원 알리미: 시간이 되면 이름과 하원 예정 시각을 음성 안내 ②","subtitle":"센터 내부 기기에서만 작동하고 외부 전송과 자동 하원 처리는 분리합니다.","body":"📌 이 기능은 ‘알림’이지 아동 인계·귀가 안전 확인을 대신하지 않습니다.","id":76},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"프로젝트 4 · 회의록","style":"콘텐츠","title":"회의록 작성기: 메모에서 결정·담당·기한까지","subtitle":"녹음 전 동의와 보관 규칙을 확인하고, 민감한 사례회의는 승인된 환경에서 처리합니다.","body":"입력 — 회의 안건, 참석자 확인, 동의받은 녹음 또는 메모\n\nAI 정리 — 논의 요약 / 결정 사항 / 담당자 / 완료 기한 / 보류·확인 질문\n\n사람 검토 — 발언 의미, 숫자, 이름, 사례 판단, 외부 공유 범위\n\n출력 — 내부 회의록과 개인정보를 뺀 공유용 요약을 별도로 저장\n\n📌 음성 녹음, 아동 사례, 건강·상담·가족 정보는 일반 회의와 다르게 다룹니다. 센터 규정과 동의·법적 근거를 먼저 확인합니다.","id":77},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"프로젝트 5 · 소식지와 안내지","style":"콘텐츠","title":"소식지·안내지 웹페이지: 모바일로 읽고 바로 공유","subtitle":"긴 종이 문서를 날짜·대상·준비물·문의처 중심의 한 화면으로 바꿉니다.","body":"필수 구성\n* 한 줄 제목과 대상\n* 날짜·시간·장소\n* 활동 내용과 준비물\n* 비용·신청 마감·문의처\n* 변경·취소·귀가 안내\n* 신청 버튼과 인쇄용 보기\n\n검수\n* 휴대전화 글자 크기와 색 대비\n* 키보드로 버튼 이동\n* 링크·전화번호·지도·다운로드 확인\n* 사진·후기·아동 정보 공개 범위 확인","id":78},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"프로젝트 6 · 홈페이지 · 1/2","style":"콘텐츠","title":"센터 홈페이지: 신뢰를 주고 관리하기 쉬운 구조 ①","subtitle":"예쁜 첫 화면보다 최신 정보, 쉬운 문의, 접근성, 담당자와 수정 절차가 중요합니다.","body":"| 메뉴 | 꼭 담을 내용 |\n| --- | --- |\n| 센터 소개 | 운영 주체, 이용 대상, 운영 시간, 연락처 |\n| 프로그램 | 현재 운영 내용과 공개 가능한 활동 기록 |\n| 이용 안내 | 신청 절차, 준비 서류, 대기·변경 안내 |","id":79},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"프로젝트 6 · 홈페이지 · 2/2","style":"콘텐츠","title":"센터 홈페이지: 신뢰를 주고 관리하기 쉬운 구조 ②","subtitle":"예쁜 첫 화면보다 최신 정보, 쉬운 문의, 접근성, 담당자와 수정 절차가 중요합니다.","body":"| 메뉴 | 꼭 담을 내용 |\n| --- | --- |\n| 소식 | 공지, 소식지, 일정, 휴관 정보 |\n| 안전·권리 | 아동 권리, 고충·문의 창구, 개인정보 처리방침 |\n\n📌 홈페이지도 운영 업무입니다. 수정 담당자, 백업, 도메인, 보안 업데이트, 오래된 글 점검일을 정합니다.","id":80},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"연결된 하루 업무 흐름","style":"콘텐츠","title":"자동화는 연결하고, 사람은 승인합니다","subtitle":"한 번의 입력을 여러 결과물로 재사용하되 민감도에 따라 흐름을 분리합니다.","body":"QR 신청 → 승인 저장소 정리 → 텔레그램 최소 알림 → 담당자 확인\n\n프로그램 기록 → 가명·공개 범위 점검 → 블로그·소식지 초안 → 게시 승인\n\n회의 메모 → 회의록 초안 → 담당·기한 확인 → 내부 공유 승인\n\n하원 예정표 → 내부 기기 음성 알림 → 종사자 대면 확인 → 하원 기록\n\n📌 자동화의 목적은 사람을 빼는 것이 아니라 **놓치기 쉬운 반복 단계를 보이게 하고 승인 지점을 분명히 하는 것**입니다.","id":81},{"part":9,"partTitle":"돌봄 현장 자동화 프로젝트","label":"4주 도입 로드맵","style":"콘텐츠","title":"작은 실험에서 안전한 운영으로","subtitle":"개인정보 없는 공개 업무부터 시작하고 검수 기록이 쌓일 때 다음 단계로 넓힙니다.","body":"| 주차 | 할 일 | 통과 기준 |\n| --- | --- | --- |\n| 1주 | 공개 자료로 블로그·안내문 초안 실습 | 사실·문체·공개 범위 검수 가능 |\n| 2주 | 소식지·안내지 웹페이지 복사본 제작 | 모바일·링크·접근성 검사 통과 |\n| 3주 | 가명 신청 데이터로 QR→정리→최소 알림 모의실험 | 원자료 외부 전송 없음, 담당자 승인 기록 |\n| 4주 | 담당자·권한·보관·오류·중단 절차 문서화 | 시설장·개인정보 담당자 검토 완료 |\n\n📌 실제 아동 자료를 넣기 전 모의 데이터로 실패와 복구 절차까지 시험합니다.","id":82},{"id":83,"part":9,"partTitle":"바이브 코딩 & 돌봄의 본질","label":"전체 강의 최종 결론","style":"마무리 슬로건","title":"기술은 부지런한 손, 돌봄 종사자는 따뜻한 눈과 책임","subtitle":"AI는 초안과 실행을 도울 수 있지만, 아동에 대한 판단·관계·안전·책임은 위임할 수 없습니다.","body":"반복 작업은 AI가 돕고, 사실·관계·아동안전·최종 책임은 사람이 맡습니다.\n\n**기계는 부지런한 손, 돌봄 종사자는 따뜻한 눈과 책임입니다.**"}]; let current=0;
    const $=id=>document.getElementById(id); const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    function markdown(text,compact=false){const lines=text.split('\n'),out=[];for(let i=0;i<lines.length;){const line=lines[i];if(!line.trim()){i++;continue}if(line.trim().startsWith('|')){const t=[];while(i<lines.length&&lines[i].trim().startsWith('|'))t.push(lines[i++]);const rows=t.map(r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));out.push('<div class="table"><table><thead><tr>'+rows[0].map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(2).map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue}const b=line.match(/^(\s*)\*\s+(.*)$/);if(b){const level=Math.min(1,Math.floor(b[1].length/2));out.push('<div class="bullet l'+level+'"><span class="mark">'+(level?'•':'◆')+'</span><div>'+inline(b[2])+'</div></div>');i++;continue}out.push('<p>'+inline(line)+'</p>');i++}return '<div class="md'+(compact?' compact':'')+'">'+out.join('')+'</div>'}
    const cover=s=>s.style.includes('표지')||s.style.includes('메인 타이틀'); const quote=s=>s.style.includes('슬로건')||s.style.includes('Quote');
    function fitSlide(){
      const stage=$('stage'),section=stage.querySelector('.content'),full=stage.querySelector('.full');
      if(!section||!full||innerWidth<=700)return;
      section.classList.remove('ultra-fit');full.style.overflow='hidden';
      const title=section.querySelector('.heading h1'),sub=section.querySelector('.heading>p:last-child'),md=full.querySelector('.md'),cells=[...full.querySelectorAll('th,td')];
      const targets=[title,sub,md,...cells].filter(Boolean);targets.forEach(el=>el.removeAttribute('style'));
      ['paddingTop','paddingRight','paddingBottom','paddingLeft'].forEach(key=>section.style[key]='');
      const base=targets.map(el=>({el,size:parseFloat(getComputedStyle(el).fontSize)}));
      const pad={top:parseFloat(getComputedStyle(section).paddingTop),right:parseFloat(getComputedStyle(section).paddingRight),bottom:parseFloat(getComputedStyle(section).paddingBottom),left:parseFloat(getComputedStyle(section).paddingLeft)};
      const overflow=()=>full.scrollHeight>full.clientHeight+2||stage.scrollHeight>stage.clientHeight+2;
      let scale=1;
      const apply=()=>{base.forEach(({el,size})=>{const floor=el===title?22:el===sub?11.5:el===md?10.5:9;el.style.fontSize=Math.max(floor,size*scale)+'px'});cells.forEach(el=>el.style.padding=Math.max(3,12*scale)+'px');section.style.paddingTop=Math.max(13,pad.top*scale)+'px';section.style.paddingBottom=Math.max(27,pad.bottom*scale)+'px';section.style.paddingLeft=Math.max(20,pad.left*scale)+'px';section.style.paddingRight=Math.max(20,pad.right*scale)+'px'};
      while(overflow()&&scale>.62){scale-=.04;apply()}
      if(overflow()){section.classList.add('ultra-fit');while(overflow()&&scale>.42){scale-=.03;apply()}}
      if(overflow())full.style.overflow='auto';
    }
    function render(){const s=slides[current];$('part').textContent='PART '+s.part+' · '+s.partTitle;$('topTitle').textContent=s.title;$('count').textContent=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('noteText').textContent=s.style+' · '+s.subtitle;let body='';if(cover(s)){body='<section class="cover"><p class="eyebrow">PART '+s.part+' · '+esc(s.partTitle)+'</p><h1>'+inline(s.title)+'</h1><p class="sub">'+inline(s.subtitle)+'</p>'+markdown(s.body,true)+'<footer class="foot"><span>AI, 두려움을 넘어 일상으로</span><span>'+String(s.id).padStart(2,'0')+'</span></footer></section>'}else if(quote(s)){body='<section class="quote"><p class="eyebrow">'+inline(s.label)+'</p><span class="qmark">“</span><h1>'+inline(s.title)+'</h1><p class="sub">'+inline(s.subtitle)+'</p>'+markdown(s.body,true)+'<footer class="foot"><span>AI, 두려움을 넘어 일상으로</span><span>'+String(s.id).padStart(2,'0')+'</span></footer></section>'}else{const copy=s.style.includes('프롬프트')?'<button onclick="copySlide()" style="float:right;border:0;border-radius:8px;padding:8px 12px;background:var(--gold-soft);color:var(--ink);font-weight:750;cursor:pointer">프롬프트 복사</button>':'';body='<section class="content"><header class="heading"><p class="eyebrow">'+inline(s.label)+'</p>'+copy+'<h1>'+inline(s.title)+'</h1><p>'+inline(s.subtitle)+'</p></header><div class="full">'+markdown(s.body)+'</div><footer class="foot"><span>AI, 두려움을 넘어 일상으로</span><span>'+String(s.id).padStart(2,'0')+'</span></footer></section>'}$('stage').innerHTML=body;history.replaceState(null,'','#slide-'+(current+1));renderToc($('search').value);requestAnimationFrame(()=>requestAnimationFrame(fitSlide))}
    function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()} function copySlide(){const s=slides[current];navigator.clipboard.writeText(s.title+'\n'+s.subtitle+'\n\n'+s.body);$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1500)}
    function renderToc(q=''){const term=q.trim().toLowerCase(),groups=[];for(let p=1;p<=9;p++){const list=slides.filter(s=>s.part===p&&(!term||(s.title+' '+s.subtitle+' '+s.label+' '+s.body).toLowerCase().includes(term)));if(!list.length)continue;groups.push('<section><h3>PART '+p+' · '+esc(list[0].partTitle)+'</h3>'+list.map(s=>'<button class="'+(s.id===current+1?'on':'')+'" onclick="go('+(s.id-1)+');tocDialog.close()"><b>'+String(s.id).padStart(2,'0')+'</b><span>'+inline(s.title)+'</span></button>').join('')+'</section>')}$('toc').innerHTML=groups.join('')}
    $('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('tocBtn').onclick=()=>{$('tocDialog').showModal();renderToc($('search').value)};$('search').oninput=e=>renderToc(e.target.value);$('noteBtn').onclick=()=>$('notes').classList.toggle('hidden');$('theme').onclick=()=>document.documentElement.classList.toggle('dark');$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key.toLowerCase()==='o')$('tocBtn').click();else if(e.key.toLowerCase()==='n')$('noteBtn').click()});let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,100)});addEventListener('beforeprint',fitSlide);
    const hash=location.hash.match(/slide-(\d+)/);if(hash)current=Math.max(0,Math.min(slides.length-1,Number(hash[1])-1));render();if(document.fonts)document.fonts.ready.then(fitSlide);
  </script>
